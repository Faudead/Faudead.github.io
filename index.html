<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мій Простір: Бюджет та Бажання</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  font-family: Arial, sans-serif;
  background: #0f172a;
  color: white;
  margin: 0;
  padding: 16px;
  -webkit-tap-highlight-color: transparent;
}

h1 {
  margin-bottom: 16px;
}

/* Навігація вкладок (Tabs) */
.tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 20px;
  border-bottom: 1px solid #334155;
  padding-bottom: 8px;
}

.tab-btn {
  background: #1e293b;
  color: #94a3b8;
  padding: 10px 20px;
  border-radius: 10px;
  border: 1px solid #334155;
  cursor: pointer;
  font-weight: bold;
  font-size: 14px;
  transition: 0.2s;
}

.tab-btn.active {
  background: #2563eb;
  color: white;
  border-color: #2563eb;
}

.tab-content {
  display: none;
}

.tab-content.active {
  display: block;
}

/* Контейнери Бюджету */
.budget-header {
  background: #1e293b;
  border: 1px solid #334155;
  border-radius: 14px;
  padding: 20px;
  margin-bottom: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 16px;
}

.free-money-box {
  text-align: right;
}

.free-title {
  font-size: 11px;
  color: #34d399;
  text-transform: uppercase;
  letter-spacing: 1px;
  font-weight: bold;
}

.free-amount {
  font-size: 32px;
  font-weight: black;
  color: #34d399;
}

.budget-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}

.chart-card {
  background: #1e293b;
  border-radius: 14px;
  border: 1px solid #334155;
  padding: 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.chart-card h3 {
  margin: 0 0 4px 0;
  font-size: 16px;
  text-align: center;
}

.chart-card p {
  margin: 0 0 16px 0;
  font-size: 12px;
  color: #94a3b8;
  text-align: center;
}

.chart-wrapper {
  position: relative;
  width: 100%;
  height: 220px;
}

/* Елементи Списку Бажань (З вашого оригінального коду) */
.controls {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 16px;
}

input, select {
  padding: 10px;
  border-radius: 10px;
  border: none;
  outline: none;
  background: #1e293b;
  color: white;
  border: 1px solid #334155;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 12px;
}

.card {
  background: #1e293b;
  border-radius: 14px;
  overflow: hidden;
  border: 1px solid #334155;
  transition: 0.2s;
}

.card:hover {
  transform: translateY(-3px);
  border-color: #3b82f6;
}

.card img {
  width: 100%;
  height: 170px;
  object-fit: contain;
  background: #0b1220;
  padding: 10px;
  box-sizing: border-box;
}

.content {
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.label {
  font-size: 10px;
  opacity: 0.6;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.category {
  font-size: 13px;
  opacity: 0.8;
}

.title {
  font-size: 16px;
  font-weight: bold;
}

.price {
  font-size: 16px;
  font-weight: bold;
  color: #34d399;
}

a {
  color: #60a5fa;
  text-decoration: none;
  font-size: 14px;
}

button {
  margin-top: 8px;
  padding: 10px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
  background: #2563eb;
  color: white;
  font-weight: bold;
}

button.bought {
  background: #16a34a;
}
</style>
</head>
<body>

<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('budget-tab', this)">📊 Бюджет та Моніторинг</button>
  <button class="tab-btn" onclick="switchTab('wishlist-tab', this)">🎁 Список бажань</button>
</div>

<div id="budget-tab" class="tab-content active">
  <div class="budget-header">
    <div>
      <h1 style="margin:0;">Фінансовий моніторинг</h1>
      <p id="income-summary" style="margin:4px 0 0 0; color:#94a3b8; font-size:14px;">Завантаження планів...</p>
    </div>
    <div class="free-money-box">
      <div class="free-title">💰 Вільно зараз</div>
      <div id="free-money" class="free-amount">0 ₴</div>
    </div>
  </div>

  <div class="budget-grid">
    <div class="chart-card">
      <h3>1. Розподіл лімітів (План)</h3>
      <p>Як ми збиралися поділити витрати</p>
      <div class="chart-wrapper"><canvas id="planChart"></canvas></div>
    </div>
    
    <div class="chart-card">
      <h3>2. Куди вже пішло (Факт)</h3>
      <p>Реальні витрати з транзакцій</p>
      <div class="chart-wrapper"><canvas id="factChart"></canvas></div>
    </div>

    <div class="chart-card">
      <h3>3. Освоєння бюджету</h3>
      <p id="progress-desc">Проїдено із загального ліміту</p>
      <div class="chart-wrapper"><canvas id="progressChart"></canvas></div>
    </div>
  </div>
</div>

<div id="wishlist-tab" class="tab-content">
  <h1>Список бажань</h1>
  <div class="controls">
    <input id="search" placeholder="Пошук...">
    <select id="category"><option value="all">Всі категорії</option></select>
    <select id="sort">
      <option value="none">Сортування</option>
      <option value="asc">Ціна ↑</option>
      <option value="desc">Ціна ↓</option>
    </select>
  </div>
  <div class="grid" id="grid"></div>
</div>

<script>
// ID вашої Google таблиці
const SHEET_ID = "1Wgs2XgmamRKgoEd_R4Z2tbOa21h8t6UjlslB62hAtYs";

// Ендпоінти opensheet для трьох різних вкладок
const URL_WISHLIST = `https://opensheet.elk.sh/${SHEET_ID}/Sheet1`;
const URL_TRANSACTIONS = `https://opensheet.elk.sh/${SHEET_ID}/Транзакції`;
const URL_BUDGET = `https://opensheet.elk.sh/${SHEET_ID}/Бюджет`;

let wishlistData = [];
let bought = JSON.parse(localStorage.getItem("bought") || "{}");

// Перемикання вкладок
function switchTab(tabId, btn) {
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(tabId).classList.add('active');
  btn.classList.add('active');
}

// Одночасне завантаження всіх джерел даних
Promise.all([
  fetch(URL_WISHLIST).then(r => r.json()).catch(() => []),
  fetch(URL_TRANSACTIONS).then(r => r.json()).catch(() => []),
  fetch(URL_BUDGET).then(r => r.json()).catch(() => [])
]).then(([wishlist, transactions, budget]) => {
  
  // 1. Ініціалізація списку бажань
  wishlistData = wishlist;
  setupWishlistFilters(wishlistData);
  renderWishlist(wishlistData);

  // 2. Обробимо фінанси
  renderBudgetDashboard(transactions, budget);
});

// --- Логіка Бюджетного Дашборду ---
function renderBudgetDashboard(transactions, budget) {
  let factIncome = 0;
  let factExpense = 0;
  let expensesByCategory = {};

  // Обробка транзакцій
  transactions.forEach(tx => {
    const sum = parseFloat(tx["Сума"]) || 0;
    if (tx["Тип"] === "Дохід") {
      factIncome += sum;
    } else if (tx["Тип"] === "Витрата") {
      factExpense += sum;
      const cat = tx["Категорія"];
      if (cat) expensesByCategory[cat] = (expensesByCategory[cat] || 0) + sum;
    }
  });

  // Обробка складного бюджетного файлу
  let planIncomeTotal = 0;
  let planExpensesByCategory = {};
  let planExpensesTotal = 0;
  let isExpenseSection = false;

  budget.forEach(row => {
    // Шукаємо ключі в першій колонці об'єкта (opensheet підставляє назву першого стовпця або властивість)
    const firstKey = Object.keys(row)[0];
    const cellValue = row[firstKey] || "";

    if (cellValue.includes("Планові доходы") || cellValue.includes("Планові доходи")) return;
    if (cellValue.includes("Планові витрати")) { isExpenseSection = true; return; }
    if (cellValue === "Стаття" || cellValue === "Категорія") return;

    // opensheet перетворює рядки на об'єкти { "Планові доходи": "Назва статті", "__EMPTY": "Значення" } тощо.
    const keys = Object.keys(row);
    const name = row[keys[0]];
    const planSum = parseFloat(row[keys[1]]) || 0;

    if (name && planSum > 0) {
      if (!isExpenseSection) {
        planIncomeTotal += planSum;
      } else {
        planExpensesByCategory[name] = planSum;
        planExpensesTotal += planSum;
      }
    }
  });

  // Розрахунок показника "ВІЛЬНО"
  const freeMoney = factIncome - factExpense;

  // Оновлення тексту
  document.getElementById('income-summary').innerText = `Очікуваний дохід (План): ${planIncomeTotal.toLocaleString('uk-UA')} ₴ | Отримано (Факт): ${factIncome.toLocaleString('uk-UA')} ₴`;
  document.getElementById('free-money').innerText = freeMoney.toLocaleString('uk-UA') + ' ₴';
  
  const percentSpent = planExpensesTotal > 0 ? Math.round((factExpense / planExpensesTotal) * 100) : 0;
  document.getElementById('progress-desc').innerText = `Витрачено ${factExpense.toLocaleString('uk-UA')} ₴ з ліміту ${planExpensesTotal.toLocaleString('uk-UA')} ₴ (${percentSpent}%)`;

  // Кольори для графіків
  const chartColors = ['#f43f5e', '#3b82f6', '#eab308', '#10b981', '#a855f7', '#f97316', '#06b6d4', '#ec4899', '#6366f1'];

  // Графік 1: План
  new Chart(document.getElementById('planChart'), {
    type: 'doughnut',
    data: {
      labels: Object.keys(planExpensesByCategory),
      datasets: [{ data: Object.values(planExpensesByCategory), backgroundColor: chartColors, borderWidth: 0 }]
    },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
  });

  // Графік 2: Факт
  new Chart(document.getElementById('factChart'), {
    type: 'doughnut',
    data: {
      labels: Object.keys(expensesByCategory),
      datasets: [{ data: Object.values(expensesByCategory), backgroundColor: chartColors, borderWidth: 0 }]
    },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
  });

  // Графік 3: Освоєння
  const remainingPlan = Math.max(0, planExpensesTotal - factExpense);
  new Chart(document.getElementById('progressChart'), {
    type: 'doughnut',
    data: {
      labels: ['Вже витрачено', 'Залишилось ліміту'],
      datasets: [{ data: [factExpense, remainingPlan], backgroundColor: ['#ef4444', '#334155'], borderWidth: 0 }]
    },
    options: { 
      responsive: true, 
      maintainAspectRatio: false, 
      plugins: { legend: { position: 'bottom', labels: { color: '#94a3b8', font: { size: 11 } } } } 
    }
  });
}

// --- Логіка Списку Бажань (Ваша оригінальна) ---
function setupWishlistFilters(data) {
  const categories = [...new Set(data.map(i => i.category).filter(Boolean))];
  const cat = document.getElementById("category");

  categories.forEach(c => {
    cat.innerHTML += `<option value="${c}">${c}</option>`;
  });

  document.getElementById("search").addEventListener("input", applyWishlistFilters);
  document.getElementById("category").addEventListener("change", applyWishlistFilters);
  document.getElementById("sort").addEventListener("change", applyWishlistFilters);
}

function applyWishlistFilters() {
  let filtered = [...wishlistData];

  const search = document.getElementById("search").value.toLowerCase();
  const category = document.getElementById("category").value;
  const sort = document.getElementById("sort").value;

  if (search) {
    filtered = filtered.filter(i => (i.title || "").toLowerCase().includes(search));
  }
  if (category !== "all") {
    filtered = filtered.filter(i => i.category === category);
  }
  if (sort === "asc") {
    filtered.sort((a, b) => Number(a.price) - Number(b.price));
  }
  if (sort === "desc") {
    filtered.sort((a, b) => Number(b.price) - Number(a.price));
  }

  renderWishlist(filtered);
}

function toggleBought(title) {
  bought[title] = !bought[title];
  localStorage.setItem("bought", JSON.stringify(bought));
  renderWishlist(wishlistData);
}

function renderWishlist(items) {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  items.forEach(item => {
    const isBought = bought[item.title];

    grid.innerHTML += `
      <div class="card">
        <img src="${item.image || ''}" onerror="this.style.display='none'">
        <div class="content">
          <div class="label">Категорія</div>
          <div class="category">${item.category || '-'}</div>
          <div class="label">Назва</div>
          <div class="title">${item.title || '-'}</div>
          <div class="label">Ціна</div>
          <div class="price">${item.price ? item.price + ' ₴' : '-'}</div>
          <div class="label">Посилання</div>
          <a href="${item.url || '#'}" target="_blank">відкрити товар</a>
          <button class="${isBought ? 'bought' : ''}" onclick="toggleBought('${item.title}')">
            ${isBought ? '✔ Куплено' : 'Позначити як куплено'}
          </button>
        </div>
      </div>
    `;
  });
}
</script>
</body>
</html>
