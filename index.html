<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Бюджет · Червень 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f7fa;
    --white: #ffffff;
    --border: #e8ecf1;
    --text: #1a202c;
    --muted: #8896a8;
    --green: #34c98a;
    --red: #f56565;
    --blue: #4299e1;
    --yellow: #f6b93b;
    --purple: #9f7aea;
    --orange: #ed8936;
    --pink: #ed64a6;
    --teal: #38b2ac;
    --shadow: 0 1px 4px rgba(0,0,0,0.07);
    --shadow-md: 0 4px 16px rgba(0,0,0,0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Nunito', sans-serif;
    min-height: 100vh;
    padding-bottom: 80px;
  }

  /* HEADER */
  .header {
    background: var(--white);
    border-bottom: 1px solid var(--border);
    padding: 16px 16px 12px;
    position: sticky; top: 0; z-index: 100;
    box-shadow: var(--shadow);
  }
  .header-row {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 12px;
  }
  .logo { font-size: 16px; font-weight: 800; color: var(--text); }
  .logo span { color: var(--green); }
  .month { font-size: 12px; color: var(--muted); font-weight: 600; background: var(--bg); padding: 4px 10px; border-radius: 20px; }

  /* NAV */
  .nav { display: flex; gap: 6px; }
  .nav-btn {
    flex: 1; padding: 9px 4px;
    border: 1.5px solid var(--border);
    background: var(--white);
    color: var(--muted);
    font-family: 'Nunito', sans-serif;
    font-size: 11px; font-weight: 700;
    border-radius: 10px; cursor: pointer;
    transition: all 0.18s;
  }
  .nav-btn.active {
    background: var(--text);
    color: var(--white);
    border-color: var(--text);
  }

  /* TABS */
  .tab { display: none; padding: 14px 14px 0; }
  .tab.active { display: block; }

  /* CARDS */
  .card {
    background: var(--white);
    border-radius: 14px;
    padding: 16px;
    box-shadow: var(--shadow);
    margin-bottom: 12px;
  }
  .card-title {
    font-size: 11px; font-weight: 700;
    color: var(--muted); text-transform: uppercase;
    letter-spacing: 1px; margin-bottom: 6px;
  }

  /* BIG BALANCE */
  .balance-card {
    background: var(--text);
    color: var(--white);
    border-radius: 18px;
    padding: 20px 18px;
    box-shadow: var(--shadow-md);
    margin-bottom: 12px;
  }
  .balance-label { font-size: 12px; font-weight: 600; opacity: 0.6; margin-bottom: 4px; }
  .balance-num { font-size: 34px; font-weight: 800; line-height: 1; margin-bottom: 2px; }
  .balance-sub { font-size: 12px; opacity: 0.55; }

  /* STAT GRID */
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .stat-cell {
    background: var(--white);
    border-radius: 14px;
    padding: 14px 12px;
    box-shadow: var(--shadow);
  }
  .stat-cell-label { font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
  .stat-cell-val { font-size: 20px; font-weight: 800; line-height: 1; margin-bottom: 2px; }
  .stat-cell-sub { font-size: 11px; color: var(--muted); }

  /* CHARTS ROW */
  .charts-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .chart-card {
    background: var(--white);
    border-radius: 14px;
    padding: 14px 12px;
    box-shadow: var(--shadow);
    text-align: center;
  }
  .chart-title { font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 10px; }
  .chart-center-label {
    font-size: 13px; font-weight: 800; color: var(--text);
    margin-top: 6px;
  }
  .chart-center-sub { font-size: 10px; color: var(--muted); }

  /* ALERT */
  .alert {
    background: #fff5f5;
    border-left: 3px solid var(--red);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 12px;
    color: #c53030;
    margin-bottom: 8px;
    font-weight: 600;
  }

  /* PROGRESS */
  .prog-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .prog-item:last-child { border-bottom: none; }
  .prog-icon { font-size: 20px; width: 32px; text-align: center; flex-shrink: 0; }
  .prog-body { flex: 1; min-width: 0; }
  .prog-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 5px; }
  .prog-name { font-size: 13px; font-weight: 700; }
  .prog-vals { font-size: 11px; color: var(--muted); }
  .prog-fact-amt { font-size: 12px; font-weight: 800; }
  .prog-bar-bg { height: 5px; background: var(--bg); border-radius: 3px; overflow: hidden; }
  .prog-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s ease; }

  /* TRANSACTIONS */
  .tx-row {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 0;
    border-bottom: 1px solid var(--border);
  }
  .tx-row:last-child { border-bottom: none; }
  .tx-icon-wrap {
    width: 38px; height: 38px; border-radius: 12px;
    background: var(--bg); display: flex; align-items: center; justify-content: center;
    font-size: 18px; flex-shrink: 0;
  }
  .tx-mid { flex: 1; min-width: 0; }
  .tx-desc { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tx-meta { font-size: 11px; color: var(--muted); margin-top: 1px; }
  .tx-amt { font-size: 14px; font-weight: 800; white-space: nowrap; }

  /* WISHLIST */
  .wish-header {
    background: var(--white);
    border-radius: 14px; padding: 14px 16px;
    box-shadow: var(--shadow); margin-bottom: 12px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .wish-header-label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
  .wish-header-val { font-size: 20px; font-weight: 800; color: var(--text); }
  .wish-section-title { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin: 14px 0 8px; }
  .wish-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 4px; }
  .wish-card {
    background: var(--white); border-radius: 14px;
    overflow: hidden; text-decoration: none; color: var(--text);
    box-shadow: var(--shadow);
    transition: transform 0.15s;
    display: block;
  }
  .wish-card:active { transform: scale(0.97); }
  .wish-img { width: 100%; height: 110px; object-fit: cover; background: var(--bg); display: block; }
  .wish-body { padding: 9px 10px; }
  .wish-cat-tag { font-size: 9px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; }
  .wish-name { font-size: 12px; font-weight: 700; margin: 2px 0 5px; line-height: 1.4; }
  .wish-price { font-size: 14px; font-weight: 800; color: var(--blue); }

  /* LOADING */
  #loading {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    min-height: 60vh; gap: 12px;
    color: var(--muted); font-size: 13px; font-weight: 600;
  }
  .spinner {
    width: 28px; height: 28px;
    border: 2px solid var(--border);
    border-top-color: var(--text);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="header">
  <div class="header-row">
    <div class="logo">бюдже<span>т</span></div>
    <div class="month">Червень 2026</div>
  </div>
  <div class="nav">
    <button class="nav-btn active" onclick="showTab('overview',this)">📊 Огляд</button>
    <button class="nav-btn" onclick="showTab('cats',this)">📂 Статті</button>
    <button class="nav-btn" onclick="showTab('txs',this)">📋 Операції</button>
    <button class="nav-btn" onclick="showTab('wish',this)">🎁 Вішліст</button>
  </div>
</div>

<div id="loading"><div class="spinner"></div>Завантаження...</div>
<div id="app" style="display:none">

<div id="tab-overview" class="tab active"></div>
<div id="tab-cats" class="tab"></div>
<div id="tab-txs" class="tab"></div>
<div id="tab-wish" class="tab"></div>

</div>

<script>
const COLORS = ['#4299e1','#34c98a','#f6b93b','#f56565','#9f7aea','#ed8936','#38b2ac','#ed64a6','#667eea','#48bb78'];

const CAT_EMOJI = {
  'оренда':'🏠','комунал':'💡','їжа':'🛒','транспорт':'🚌','звяз':'📱',"зв'яз":'📱',
  'побут':'🧹','хотілк':'✨','медицин':'💊','відклад':'💰','зарплат':'💵',
  'кредит':'🏦','англ':'📚','готівк':'💵','перевод':'↔️'
};
function emo(cat) {
  if (!cat) return '💸';
  const c = cat.toLowerCase();
  for (const [k,v] of Object.entries(CAT_EMOJI)) if (c.includes(k)) return v;
  return '💸';
}
function fmt(n) { return Math.round(Number(n)||0).toLocaleString('uk-UA') + ' ₴'; }
function fmtDate(iso) {
  const d = new Date(iso);
  return `${d.getDate().toString().padStart(2,'0')}.${(d.getMonth()+1).toString().padStart(2,'0')}`;
}

// Simple SVG donut
function donut(used, total, color, size=100) {
  const pct = total > 0 ? Math.min(used/total, 1) : 0;
  const r = 38, cx = 52, cy = 52, sw = 10;
  const circ = 2*Math.PI*r;
  const dash = pct * circ;
  const over = used > total && total > 0;
  const fillColor = over ? '#f56565' : color;
  const pctText = total > 0 ? Math.round(pct*100)+'%' : '—';
  return `<svg width="${size}" height="${size}" viewBox="0 0 104 104">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#f0f2f5" stroke-width="${sw}"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${fillColor}" stroke-width="${sw}"
      stroke-dasharray="${dash} ${circ}" stroke-dashoffset="${circ/4}" stroke-linecap="round"/>
    <text x="${cx}" y="${cy+5}" text-anchor="middle" fill="#1a202c" font-size="16" font-weight="800" font-family="Nunito,sans-serif">${pctText}</text>
  </svg>`;
}

async function load() {
  let d;
  try {
    const res = await fetch('data.json');
    d = await res.json();
  } catch(e) {
    document.getElementById('loading').innerHTML = '<div style="color:#f56565;font-weight:700">Помилка завантаження data.json</div>';
    return;
  }
  document.getElementById('loading').style.display = 'none';
  document.getElementById('app').style.display = 'block';

  // Parse transactions
  const txs = (d.transactions||[]).map(t=>({
    date: t['Дата']||t.date||'',
    type: t['Тип']||t.type||'',
    cat: t['Категорія']||t.cat||'',
    desc: t['Опис']||t.desc||'',
    sum: Number(t['Сума']||t.sum||0)
  }));

  // Parse budget plan
  const planMap = {};
  let expectedIncome = 0;
  for (const row of (d.budget||[])) {
    const name = row['Планові доходи']||'';
    const plan = row['Unnamed: 1']||row['План']||'';
    const fact = row['Unnamed: 2']||row['Факт']||'';
    if (name === 'Скіко очікується') expectedIncome = Number(fact)||0;
    if (!isNaN(Number(plan)) && plan !== '' && Number(plan) > 0) {
      planMap[name] = Number(plan);
    }
  }

  const income = txs.filter(t=>t.type==='Дохід').reduce((a,t)=>a+t.sum,0);
  const expense = txs.filter(t=>t.type==='Витрата').reduce((a,t)=>a+t.sum,0);
  const balance = income - expense;

  const catActual = {};
  for (const t of txs.filter(t=>t.type==='Витрата')) {
    catActual[t.cat] = (catActual[t.cat]||0) + t.sum;
  }

  const PLAN_CATS = [
    {name:'Оренда',  planKey:'Оренда',   txKey:'Оренда'},
    {name:'Комуналка',planKey:'Комуналка',txKey:'Комуналка'},
    {name:'Їжа',     planKey:'Їжа',      txKey:'Їжа'},
    {name:'Транспорт',planKey:'Транспорт',txKey:'Транспорт'},
    {name:"Зв'язок", planKey:'Звʼязок',  txKey:"Зв'язок"},
    {name:'Побут',   planKey:'Побут',     txKey:'Побут'},
    {name:'Хотілки', planKey:'Хотілки',  txKey:'Хотілки'},
    {name:'Медицина',planKey:'Медицина', txKey:'Медицина'},
    {name:'Відкладення',planKey:'Відкладення',txKey:'Відкладення'},
    {name:'Англійська',planKey:'Англа',  txKey:'Англ'},
    {name:'Кредит',  planKey:'Кредит',   txKey:'Кредит'},
  ];

  const planTotal = PLAN_CATS.reduce((a,c)=>a+(planMap[c.planKey]||0),0);

  // Match actual by txKey
  function getActual(txKey) {
    let total = 0;
    for (const [k,v] of Object.entries(catActual)) {
      if (k.toLowerCase().includes(txKey.toLowerCase().slice(0,4))) total += v;
    }
    return total;
  }

  // ===== OVERVIEW =====
  const ov = document.getElementById('tab-overview');

  // Alerts
  const alerts = PLAN_CATS
    .filter(c => planMap[c.planKey] > 0 && getActual(c.txKey) > planMap[c.planKey])
    .map(c => {
      const over = getActual(c.txKey) - planMap[c.planKey];
      return `<div class="alert">${emo(c.name)} ${c.name}: перевищення на ${fmt(over)} (план ${fmt(planMap[c.planKey])}, факт ${fmt(getActual(c.txKey))})</div>`;
    }).join('');

  ov.innerHTML = `
    <div class="balance-card">
      <div class="balance-label">Поточний залишок</div>
      <div class="balance-num" style="color:${balance>=0?'#34c98a':'#f56565'}">${fmt(balance)}</div>
      <div class="balance-sub">${balance>=0?'все ок ✓':'увага, мінус ⚠'}  ·  отримано ${fmt(income)}</div>
    </div>

    ${alerts}

    <div class="stat-grid">
      <div class="stat-cell">
        <div class="stat-cell-label">Доходи</div>
        <div class="stat-cell-val" style="color:#34c98a">${fmt(income)}</div>
        <div class="stat-cell-sub">факт</div>
      </div>
      <div class="stat-cell">
        <div class="stat-cell-label">Витрати</div>
        <div class="stat-cell-val" style="color:#f56565">${fmt(expense)}</div>
        <div class="stat-cell-sub">факт</div>
      </div>
      <div class="stat-cell">
        <div class="stat-cell-label">Очікується ще</div>
        <div class="stat-cell-val" style="color:#f6b93b">${fmt(expectedIncome)}</div>
        <div class="stat-cell-sub">аванс / решта</div>
      </div>
      <div class="stat-cell">
        <div class="stat-cell-label">Плановий бюджет</div>
        <div class="stat-cell-val" style="color:#4299e1">${fmt(planTotal)}</div>
        <div class="stat-cell-sub">витрати</div>
      </div>
    </div>

    <div class="charts-row">
      <div class="chart-card">
        <div class="chart-title">Бюджет використано</div>
        ${donut(expense, planTotal, '#4299e1', 110)}
        <div class="chart-center-label">${fmt(expense)}</div>
        <div class="chart-center-sub">з ${fmt(planTotal)}</div>
      </div>
      <div class="chart-card">
        <div class="chart-title">Доходи отримано</div>
        ${donut(income, income + expectedIncome, '#34c98a', 110)}
        <div class="chart-center-label">${fmt(income)}</div>
        <div class="chart-center-sub">з ${fmt(income + expectedIncome)}</div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Топ витрат</div>
      ${Object.entries(catActual).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([cat,val],i)=>{
        const pct = expense > 0 ? Math.round(val/expense*100) : 0;
        return `<div class="prog-item">
          <div class="prog-icon">${emo(cat)}</div>
          <div class="prog-body">
            <div class="prog-row">
              <div class="prog-name">${cat}</div>
              <div class="prog-fact-amt">${fmt(val)}</div>
            </div>
            <div class="prog-bar-bg">
              <div class="prog-bar-fill" style="width:${pct}%;background:${COLORS[i%COLORS.length]}"></div>
            </div>
          </div>
        </div>`;
      }).join('')}
    </div>`;

  // ===== CATEGORIES =====
  const catsEl = document.getElementById('tab-cats');

  // Two donuts: plan distribution + actual vs plan
  const planParts = PLAN_CATS.filter(c=>planMap[c.planKey]>0);
  const planColors = planParts.map((_,i)=>COLORS[i%COLORS.length]);

  // SVG pie for plan distribution
  function pie(parts, size=130) {
    const total = parts.reduce((a,p)=>a+p.value,0);
    if (!total) return '';
    let angle = -Math.PI/2;
    const cx=size/2, cy=size/2, r=size/2-8;
    let paths = '';
    for (let i=0;i<parts.length;i++) {
      const sweep = (parts[i].value/total)*2*Math.PI;
      if (sweep < 0.01) { angle += sweep; continue; }
      const x1=cx+r*Math.cos(angle), y1=cy+r*Math.sin(angle);
      const x2=cx+r*Math.cos(angle+sweep), y2=cy+r*Math.sin(angle+sweep);
      const large = sweep > Math.PI ? 1 : 0;
      paths += `<path d="M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${large},1 ${x2},${y2} Z" fill="${parts[i].color}" opacity="0.9"/>`;
      angle += sweep;
    }
    return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${paths}</svg>`;
  }

  const planPie = planParts.map((c,i)=>({value:planMap[c.planKey], color:planColors[i], label:c.name}));
  const actualPie = planParts.map((c,i)=>({value:getActual(c.txKey)||0, color:planColors[i], label:c.name}));

  catsEl.innerHTML = `
    <div class="charts-row" style="margin-top:2px">
      <div class="chart-card">
        <div class="chart-title">Плановий розподіл</div>
        ${pie(planPie,130)}
      </div>
      <div class="chart-card">
        <div class="chart-title">Фактичний розподіл</div>
        ${pie(actualPie,130)}
      </div>
    </div>

    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px">
      ${planParts.map((c,i)=>`
        <div style="display:flex;align-items:center;gap:4px;font-size:11px;font-weight:600;color:#555">
          <div style="width:8px;height:8px;border-radius:50%;background:${planColors[i]};flex-shrink:0"></div>
          ${c.name}
        </div>`).join('')}
    </div>

    <div class="charts-row">
      <div class="chart-card">
        <div class="chart-title">Витрачено з плану</div>
        ${donut(expense, planTotal, '#4299e1', 110)}
        <div class="chart-center-sub">${fmt(expense)} з ${fmt(planTotal)}</div>
      </div>
      <div class="chart-card">
        <div class="chart-title">Залишок бюджету</div>
        ${donut(Math.max(planTotal-expense,0), planTotal, '#34c98a', 110)}
        <div class="chart-center-sub">${fmt(Math.max(planTotal-expense,0))} лишилось</div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Деталі по статтях</div>
      ${PLAN_CATS.map((c,i)=>{
        const plan = planMap[c.planKey]||0;
        const actual = getActual(c.txKey);
        const pct = plan > 0 ? Math.min(Math.round(actual/plan*100),150) : (actual>0?100:0);
        const over = actual > plan && plan > 0;
        const barColor = pct >= 100 ? '#f56565' : pct >= 80 ? '#f6b93b' : '#34c98a';
        return `<div class="prog-item">
          <div class="prog-icon">${emo(c.name)}</div>
          <div class="prog-body">
            <div class="prog-row">
              <div class="prog-name">${c.name}</div>
              <div>
                <span class="prog-fact-amt" style="color:${over?'#f56565':'#1a202c'}">${fmt(actual)}</span>
                <span class="prog-vals"> / ${fmt(plan)}</span>
              </div>
            </div>
            <div class="prog-bar-bg">
              <div class="prog-bar-fill" style="width:${Math.min(pct,100)}%;background:${barColor}"></div>
            </div>
          </div>
        </div>`;
      }).join('')}
    </div>`;

  // ===== TRANSACTIONS =====
  const txsEl = document.getElementById('tab-txs');
  const sorted = [...txs].sort((a,b)=>new Date(b.date)-new Date(a.date));
  txsEl.innerHTML = `<div class="card" style="margin-top:2px">
    ${sorted.map(t=>{
      const inc = t.type==='Дохід';
      return `<div class="tx-row">
        <div class="tx-icon-wrap">${emo(t.cat)}</div>
        <div class="tx-mid">
          <div class="tx-desc">${t.desc||t.cat}</div>
          <div class="tx-meta">${t.cat} · ${fmtDate(t.date)}</div>
        </div>
        <div class="tx-amt" style="color:${inc?'#34c98a':'#f56565'}">${inc?'+':'-'}${fmt(t.sum)}</div>
      </div>`;
    }).join('')}
  </div>`;

  // ===== WISHLIST =====
  const wishEl = document.getElementById('tab-wish');
  const wishlist = d.wishlist||[];
  const totalWish = wishlist.reduce((a,w)=>a+Number(w.price||0),0);
  const wishCats = [...new Set(wishlist.map(w=>w.category))];

  wishEl.innerHTML = `
    <div class="wish-header" style="margin-top:2px">
      <div>
        <div class="wish-header-label">Всього у вішлісті</div>
        <div class="wish-header-val">${fmt(totalWish)}</div>
      </div>
      <div style="font-size:11px;color:var(--muted);font-weight:700">${wishlist.length} товарів</div>
    </div>
    ${wishCats.map(cat=>{
      const items = wishlist.filter(w=>w.category===cat);
      return `<div class="wish-section-title">${cat}</div>
        <div class="wish-grid">
          ${items.map(w=>`
            <a href="${w.url}" target="_blank" class="wish-card">
              <img class="wish-img" src="${w.image}" loading="lazy" onerror="this.style.background='#f0f2f5';this.style.display='block'">
              <div class="wish-body">
                <div class="wish-name">${w.title}</div>
                <div class="wish-price">${fmt(w.price)}</div>
              </div>
            </a>`).join('')}
        </div>`;
    }).join('')}`;
}

function showTab(id, btn) {
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+id).classList.add('active');
  btn.classList.add('active');
}

load();
</script>
</body>
</html>
