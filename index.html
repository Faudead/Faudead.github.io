<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мій Простір: Бюджет</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  font-family: Arial, sans-serif;
  background:#0f172a;
  color:white;
  margin:0;
  padding:16px;
}

h1 { margin:0 0 12px 0; }

.tabs { display:flex; gap:10px; margin-bottom:16px; }

.tab-btn {
  padding:10px 16px;
  background:#1e293b;
  border:none;
  color:#94a3b8;
  border-radius:10px;
}

.tab-btn.active {
  background:#2563eb;
  color:white;
}

.tab-content { display:none; }
.tab-content.active { display:block; }

.grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:12px;
}

.card {
  background:#1e293b;
  border-radius:12px;
  padding:12px;
}

.chart-wrapper {
  height:220px;
}

.small {
  font-size:13px;
  color:#94a3b8;
}

.big {
  font-size:28px;
  font-weight:bold;
  color:#22c55e;
}

</style>

</head>
<body>

<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('budget',this)">📊 Бюджет</button>
  <button class="tab-btn" onclick="switchTab('wish',this)">🎁 Wishlist</button>
</div>

<div id="budget" class="tab-content active">

  <h1>Фінанси</h1>

  <div class="grid">

    <div class="card">
      <div class="small">💰 Вільні гроші</div>
      <div id="freeMoney" class="big">0 ₴</div>
      <div id="incomeInfo" class="small"></div>
    </div>

    <div class="card">
      <div class="small">1. Вільні гроші</div>
      <div class="chart-wrapper">
        <canvas id="freeChart"></canvas>
      </div>
    </div>

    <div class="card">
      <div class="small">2. Куди пішло</div>
      <div class="chart-wrapper">
        <canvas id="factChart"></canvas>
      </div>
    </div>

    <div class="card">
      <div class="small">3. Бюджет</div>

      <div class="small" id="budgetText"></div>

      <div class="chart-wrapper">
        <canvas id="budgetChart"></canvas>
      </div>
    </div>

  </div>

</div>

<div id="wish" class="tab-content">
  <h1>Wishlist</h1>
  <div id="grid"></div>
</div>

<script>

let wishlist = [];
let bought = JSON.parse(localStorage.getItem("bought")||"{}");

function switchTab(id,btn){
  document.querySelectorAll(".tab-content").forEach(e=>e.classList.remove("active"));
  document.querySelectorAll(".tab-btn").forEach(e=>e.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  btn.classList.add("active");
}

fetch("data.json?t="+Date.now())
.then(r=>r.json())
.then(data=>{
  render(data.transactions||[], data.budget||[]);
  wishlist = data.wishlist||[];
  renderWishlist(wishlist);
});

function render(transactions,budget){

  let income=0;
  let expense=0;

  let cats={
    "оренда":0,
    "комуналка":0,
    "їжа":0,
    "транспорт":0,
    "зв'язок":0,
    "інше":0
  };

  transactions.forEach(t=>{
    let type=t["Тип"];
    let sum=parseFloat(t["Сума"]||0);
    let cat=(t["Категорія"]||"").toLowerCase();

    if(type==="Дохід") income+=sum;

    if(type==="Витрата"){
      expense+=sum;

      if(cat.includes("орен")) cats["оренда"]+=sum;
      else if(cat.includes("комун")) cats["комуналка"]+=sum;
      else if(cat.includes("їж")) cats["їжа"]+=sum;
      else if(cat.includes("транс")) cats["транспорт"]+=sum;
      else if(cat.includes("зв")) cats["зв'язок"]+=sum;
      else cats["інше"]+=sum;
    }
  });

  let plan=0;
  budget.forEach(b=>{
    let v=parseFloat(b[Object.keys(b)[1]]||0);
    if(!isNaN(v)) plan+=v;
  });

  let free = income-expense;
  let remaining = Math.max(0,plan-expense);

  document.getElementById("freeMoney").innerText=free.toLocaleString()+" ₴";
  document.getElementById("incomeInfo").innerText=
    `Дохід: ${income} | Витрати: ${expense}`;

  document.getElementById("budgetText").innerText=
    `Витрачено ${expense} ₴ / ${plan} ₴ (залишилось ${remaining} ₴)`;

  // ===== COLORS =====
  const green="#22c55e";
  const red="#ef4444";
  const gray="#334155";

  const blue="#3b82f6";
  const yellow="#eab308";
  const purple="#a855f7";

  // ===== FREE =====
  new Chart(document.getElementById("freeChart"),{
    type:"doughnut",
    data:{
      labels:["Дохід","Витрати","Залишок"],
      datasets:[{
        data:[income,expense,free],
        backgroundColor:[green,red,"#16a34a"]
      }]
    }
  });

  // ===== FACT =====
  new Chart(document.getElementById("factChart"),{
    type:"doughnut",
    data:{
      labels:Object.keys(cats),
      datasets:[{
        data:Object.values(cats),
        backgroundColor:[blue,gray,green,yellow,purple,"#64748b"]
      }]
    }
  });

  // ===== BUDGET =====
  new Chart(document.getElementById("budgetChart"),{
    type:"doughnut",
    data:{
      labels:["Витрачено","Залишок"],
      datasets:[{
        data:[expense,remaining],
        backgroundColor:[red,gray]
      }]
    }
  });

}

function renderWishlist(items){
  let g=document.getElementById("grid");
  g.innerHTML="";

  items.forEach(i=>{
    let t=i.title||i.Назва||"";
    let p=i.price||i.Ціна||"";

    g.innerHTML+=`
      <div class="card">
        <div>${t}</div>
        <div>${p} ₴</div>
        <button onclick="toggle('${t}')">
          ${bought[t]?"✔ Куплено":"Купити"}
        </button>
      </div>
    `;
  });
}

function toggle(t){
  bought[t]=!bought[t];
  localStorage.setItem("bought",JSON.stringify(bought));
  renderWishlist(wishlist);
}

</script>

</body>
</html>
