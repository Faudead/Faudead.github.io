<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Фінансовий простір</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
  margin:0;
  padding:16px;
  background:#0f172a;
  color:white;
  font-family:Arial;
}

.tabs{display:flex;gap:10px;margin-bottom:16px;}
.tab-btn{
  padding:10px 14px;
  background:#1e293b;
  border:none;
  color:#94a3b8;
  border-radius:10px;
}
.tab-btn.active{background:#2563eb;color:white;}

.tab-content{display:none;}
.tab-content.active{display:block;}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:12px;
}

.card{
  background:#1e293b;
  border-radius:12px;
  padding:12px;
}

.small{color:#94a3b8;font-size:13px;}
.big{font-size:26px;font-weight:bold;color:#22c55e;}

.chart-wrapper{height:220px;}
img{width:100%;height:160px;object-fit:contain;background:#0b1220;border-radius:8px;}

button{
  margin-top:8px;
  padding:8px;
  border:none;
  border-radius:8px;
  background:#2563eb;
  color:white;
}

</style>
</head>

<body>

<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('budget',this)">📊 Бюджет</button>
  <button class="tab-btn" onclick="switchTab('wish',this)">🎁 Wishlist</button>
</div>

<!-- ================= BUDGET ================= -->
<div id="budget" class="tab-content active">

  <div class="grid">

    <div class="card">
      <div class="small">💰 Залишок</div>
      <div id="freeMoney" class="big">0 ₴</div>
      <div id="info" class="small"></div>
    </div>

    <div class="card">
      <div class="small">Доходи / витрати</div>
      <div class="chart-wrapper">
        <canvas id="freeChart"></canvas>
      </div>
    </div>

    <div class="card">
      <div class="small">Куди пішло</div>
      <div class="chart-wrapper">
        <canvas id="factChart"></canvas>
      </div>
    </div>

  </div>

</div>

<!-- ================= WISHLIST ================= -->
<div id="wish" class="tab-content">

  <h2>Wishlist</h2>
  <div id="grid"></div>

</div>

<script>

let wishlist=[];
let bought=JSON.parse(localStorage.getItem("bought")||"{}");

function switchTab(id,btn){
  document.querySelectorAll(".tab-content").forEach(e=>e.classList.remove("active"));
  document.querySelectorAll(".tab-btn").forEach(e=>e.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  btn.classList.add("active");
}

fetch("data.json?t="+Date.now())
.then(r=>r.json())
.then(data=>{
  renderBudget(data.transactions||[]);
  wishlist=data.wishlist||[];
  renderWishlist(wishlist);
});

function renderBudget(transactions){

  let income=0;
  let expense=0;

  let cats={
    "оренда":0,
    "комуналка":0,
    "їжа":0,
    "транспорт":0,
    "зв'язок":0,
    "інше":0
  };

  transactions.forEach(t=>{
    let type=t["Тип"];
    let sum=parseFloat(t["Сума"]||0);
    let cat=(t["Категорія"]||"").toLowerCase();

    if(type==="Дохід") income+=sum;

    if(type==="Витрата"){
      expense+=sum;

      if(cat.includes("орен")) cats["оренда"]+=sum;
      else if(cat.includes("комун")) cats["комуналка"]+=sum;
      else if(cat.includes("їж")) cats["їжа"]+=sum;
      else if(cat.includes("транс")) cats["транспорт"]+=sum;
      else if(cat.includes("зв")) cats["зв'язок"]+=sum;
      else cats["інше"]+=sum;
    }
  });

  let free=income-expense;

  document.getElementById("freeMoney").innerText=
    free.toLocaleString()+" ₴";

  document.getElementById("info").innerText=
    `Дохід ${income} ₴ | Витрати ${expense} ₴`;

  // ===== FREE CHART =====
  new Chart(document.getElementById("freeChart"),{
    type:"doughnut",
    data:{
      labels:["Дохід","Витрати","Залишок"],
      datasets:[{
        data:[income,expense,free],
        backgroundColor:["#22c55e","#ef4444","#16a34a"]
      }]
    }
  });

  // ===== FACT CHART =====
  new Chart(document.getElementById("factChart"),{
    type:"doughnut",
    data:{
      labels:Object.keys(cats),
      datasets:[{
        data:Object.values(cats),
        backgroundColor:[
          "#3b82f6",
          "#64748b",
          "#22c55e",
          "#eab308",
          "#a855f7",
          "#94a3b8"
        ]
      }]
    }
  });

}

function renderWishlist(items){
  let grid=document.getElementById("grid");
  grid.innerHTML="";

  items.forEach(i=>{
    const title=i.title||i.Назва||"";
    const price=i.price||i.Ціна||"";
    const img=i.image||i.Картинка||"";
    const url=i.url||i.Посилання||"#";
    const cat=i.category||i.Категорія||"";

    grid.innerHTML+=`
      <div class="card">
        <img src="${img}" onerror="this.style.display='none'">
        <div>${title}</div>
        <div class="small">${cat}</div>
        <div>${price} ₴</div>
        <a href="${url}" target="_blank">відкрити</a>
      </div>
    `;
  });
}

</script>

</body>
</html>
