<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Фінанси + Wishlist</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  font-family: Arial;
  background: #0f172a;
  color: white;
  margin: 0;
  padding: 16px;
}

.tabs {
  display: flex;
  gap: 10px;
  margin-bottom: 16px;
}

.tab-btn {
  padding: 10px 14px;
  border-radius: 10px;
  border: 1px solid #334155;
  background: #1e293b;
  color: #94a3b8;
  cursor: pointer;
}

.tab-btn.active {
  background: #2563eb;
  color: white;
}

.tab {
  display: none;
}

.tab.active {
  display: block;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 12px;
}

.card {
  background: #1e293b;
  border-radius: 14px;
  padding: 12px;
  border: 1px solid #334155;
}

img {
  width: 100%;
  height: 160px;
  object-fit: contain;
  background: #0b1220;
  border-radius: 10px;
}

button {
  margin-top: 8px;
  padding: 10px;
  width: 100%;
  border-radius: 10px;
  border: none;
  cursor: pointer;
  background: #2563eb;
  color: white;
}

button.done {
  background: #16a34a;
}

canvas {
  margin-bottom: 20px;
}
</style>
</head>

<body>

<div class="tabs">
  <button class="tab-btn active" onclick="openTab('budget')">📊 Бюджет</button>
  button class="tab-btn" onclick="openTab('wish')">🎁 Wishlist</button>
</div>

<!-- ================= BUDGET ================= -->
<div id="budget" class="tab active">

  <h2>Фінанси</h2>

  <div style="display:grid; gap:20px;">

    <div>
      <h3>ФАКТ (дохід / витрати / залишок)</h3>
      <canvas id="factChart"></canvas>
    </div>

    <div>
      <h3>ПЛАН (як має бути)</h3>
      <canvas id="planChart"></canvas>
    </div>

    <div>
      <h3>КОНТРОЛЬ (чи вліз у бюджет)</h3>
      <canvas id="controlChart"></canvas>
    </div>

  </div>

</div>

<!-- ================= WISHLIST ================= -->
<div id="wish" class="tab">

  <h2>Wishlist</h2>

  <div class="grid" id="grid"></div>

</div>

<script>
let dataGlobal = [];
let bought = JSON.parse(localStorage.getItem("bought") || "{}");

// tabs
function openTab(id){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));

  document.getElementById(id).classList.add('active');
  event.target.classList.add('active');
}

// ================= DATA =================
fetch("data.json?t=" + Date.now())
.then(r=>r.json())
.then(data=>{

  dataGlobal = data;

  renderBudget(data.transactions || []);
  renderWishlist(data.wishlist || []);

});

// ================= BUDGET =================
function renderBudget(tr){

  let income = 0;
  let expense = 0;

  let fact = {
    rent:0,
    food:0,
    transport:0,
    utils:0,
    other:0
  };

  tr.forEach(t=>{

    let type = t["Тип"];
    let sum = Number(t["Сума"]||0);
    let cat = (t["Категорія"]||"").toLowerCase();

    if(type === "Дохід") income += sum;

    if(type === "Витрата"){
      expense += sum;

      if(cat.includes("орен")) fact.rent += sum;
      else if(cat.includes("їж")) fact.food += sum;
      else if(cat.includes("транс")) fact.transport += sum;
      else if(cat.includes("комун")) fact.utils += sum;
      else fact.other += sum;
    }
  });

  let free = income - expense;

  // ===== FACT =====
  new Chart(document.getElementById("factChart"),{
    type:"pie",
    data:{
      labels:["Дохід","Витрати","Залишок"],
      datasets:[{
        data:[income, expense, free],
        backgroundColor:["#22c55e","#ef4444","#16a34a"]
      }]
    }
  });

  // ===== PLAN (умовний приклад) =====
  let plan = {
    rent:12000,
    food:8000,
    transport:2000,
    utils:3000,
    other:2000
  };

  let planTotal = Object.values(plan).reduce((a,b)=>a+b,0);

  new Chart(document.getElementById("planChart"),{
    type:"pie",
    data:{
      labels:Object.keys(plan).concat(["вільно"]),
      datasets:[{
        data:[...Object.values(plan), Math.max(0, income - planTotal)],
        backgroundColor:[
          "#60a5fa","#fbbf24","#a78bfa","#94a3b8","#f97316","#22c55e"
        ]
      }]
    }
  });

  // ===== CONTROL =====
  let ok = Math.min(expense, planTotal);
  let over = Math.max(0, expense - planTotal);
  let left = Math.max(0, planTotal - expense);

  new Chart(document.getElementById("controlChart"),{
    type:"pie",
    data:{
      labels:["В нормі","Перевитрата","Ще можна"],
      datasets:[{
        data:[ok, over, left],
        backgroundColor:["#22c55e","#ef4444","#3b82f6"]
      }]
    }
  });

}

// ================= WISHLIST =================
function renderWishlist(items){

  let grid = document.getElementById("grid");
  grid.innerHTML = "";

  items.forEach(i=>{

    let done = bought[i.title];

    grid.innerHTML += `
      <div class="card">

        <img src="${i.image || ''}">

        <h4>${i.title}</h4>
        <div>${i.category}</div>
        <div><b>${i.price} ₴</b></div>

        <a href="${i.url}" target="_blank">відкрити</a>

        <button class="${done ? 'done' : ''}"
          onclick="toggle('${i.title}')">

          ${done ? '✔ куплено' : 'відмітити'}

        </button>

      </div>
    `;
  });
}

function toggle(title){
  bought[title] = !bought[title];
  localStorage.setItem("bought", JSON.stringify(bought));
  renderWishlist(dataGlobal.wishlist || []);
}

</script>

</body>
</html>
