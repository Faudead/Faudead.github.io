<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мій Простір: Бюджет та Бажання</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body { font-family: Arial, sans-serif; background: #0f172a; color: white; margin: 0; padding: 16px; -webkit-tap-highlight-color: transparent; }
h1 { margin-bottom: 16px; }

#debug-log {
  background: #1e1b4b;
  border: 1px solid #818cf8;
  border-radius: 10px;
  padding: 12px;
  margin-bottom: 16px;
  font-family: monospace;
  font-size: 12px;
  color: #c7d2fe;
  display: none;
}

.tabs { display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 1px solid #334155; padding-bottom: 8px; }
.tab-btn { background: #1e293b; color: #94a3b8; padding: 10px 20px; border-radius: 10px; border: 1px solid #334155; cursor: pointer; font-weight: bold; font-size: 14px; }
.tab-btn.active { background: #2563eb; color: white; }

.tab-content { display: none; }
.tab-content.active { display: block; }

.budget-header {
  background: #1e293b;
  border: 1px solid #334155;
  border-radius: 14px;
  padding: 20px;
  margin-bottom: 20px;
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 16px;
}

.free-amount { font-size: 32px; font-weight: bold; color: #34d399; }

.chart-card {
  background: #1e293b;
  border-radius: 14px;
  border: 1px solid #334155;
  padding: 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.chart-wrapper { width: 100%; height: 220px; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }

.card {
  background: #1e293b;
  border-radius: 14px;
  overflow: hidden;
  border: 1px solid #334155;
}

.card img { width: 100%; height: 170px; object-fit: contain; background: #0b1220; padding: 10px; }

.content { padding: 12px; }

button {
  margin-top: 8px;
  padding: 10px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
  background: #2563eb;
  color: white;
  font-weight: bold;
}

button.bought { background: #16a34a; }

</style>
</head>

<body>

<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('budget-tab', this)">📊 Бюджет</button>
  <button class="tab-btn" onclick="switchTab('wishlist-tab', this)">🎁 Wishlist</button>
</div>

<div id="budget-tab" class="tab-content active">

  <div class="budget-header">
    <div>
      <h1 style="margin:0;">Фінанси</h1>
      <p id="income-summary">Завантаження...</p>
    </div>
    <div>
      <div>💰 Вільно</div>
      <div id="free-money" class="free-amount">0 ₴</div>
    </div>
  </div>

  <div class="chart-card">
    <h3>Бюджет використання</h3>

    <!-- 🔥 НОВИЙ БЛОК -->
    <div style="text-align:center; margin-bottom:10px; font-size:14px; color:#94a3b8;">
      <div id="budget-used">—</div>
      <div id="budget-remaining">—</div>
      <div id="budget-total">—</div>
    </div>

    <div class="chart-wrapper">
      <canvas id="progressChart"></canvas>
    </div>
  </div>

</div>

<div id="wishlist-tab" class="tab-content">
  <h1>Wishlist</h1>
  <div class="grid" id="grid"></div>
</div>

<script>

let wishlistData = [];
let bought = JSON.parse(localStorage.getItem("bought") || "{}");

function switchTab(id, btn){
  document.querySelectorAll('.tab-content').forEach(e=>e.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(e=>e.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  btn.classList.add('active');
}

function normalizeStr(str){
  return (str||"").toLowerCase().trim();
}

fetch("data.json?t=" + Date.now())
.then(r=>r.json())
.then(data=>{

  renderBudget(data.transactions || [], data.budget || []);

  wishlistData = data.wishlist || [];
  renderWishlist(wishlistData);

});

function renderBudget(transactions, budget){

  let income = 0;
  let expense = 0;

  transactions.forEach(t=>{
    let type = t["Тип"] || "";
    let sum = parseFloat(t["Сума"] || 0);

    if(type==="Дохід") income += sum;
    if(type==="Витрата") expense += sum;
  });

  let planTotal = 0;

  budget.forEach(b=>{
    let keys = Object.keys(b);
    let val = parseFloat(b[keys[1]] || 0);
    if(!isNaN(val)) planTotal += val;
  });

  let remaining = Math.max(0, planTotal - expense);

  document.getElementById("income-summary").innerText =
    `Дохід: ${income.toLocaleString()} ₴ | Витрати: ${expense.toLocaleString()} ₴`;

  document.getElementById("free-money").innerText =
    (income - expense).toLocaleString() + " ₴";

  // 🔥 нові підписи
  document.getElementById("budget-used").innerText =
    `Витрачено: ${expense.toLocaleString()} ₴`;

  document.getElementById("budget-remaining").innerText =
    `Залишилось: ${remaining.toLocaleString()} ₴`;

  document.getElementById("budget-total").innerText =
    `Всього план: ${planTotal.toLocaleString()} ₴`;

  new Chart(document.getElementById("progressChart"),{
    type:"doughnut",
    data:{
      labels:["Витрачено","Залишилось"],
      datasets:[{
        data:[expense, remaining],
        backgroundColor:["#ef4444","#334155"]
      }]
    },
    options:{
      plugins:{legend:{labels:{color:"white"}}}
    }
  });

}

function renderWishlist(items){
  let grid = document.getElementById("grid");
  grid.innerHTML = "";

  items.forEach(i=>{
    let title = i.title || i.Назва || "";
    let price = i.price || i.Ціна || "";

    grid.innerHTML += `
      <div class="card">
        <div class="content">
          <div>${title}</div>
          <div>${price} ₴</div>
          <button onclick="toggle('${title}')">
            ${bought[title] ? "✔ Куплено" : "Купити"}
          </button>
        </div>
      </div>
    `;
  });
}

function toggle(title){
  bought[title] = !bought[title];
  localStorage.setItem("bought", JSON.stringify(bought));
  renderWishlist(wishlistData);
}

</script>

</body>
</html>
