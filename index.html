<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Фінанси та Вішліст</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; padding: 20px; }
        .tab { display: none; }
        .tab.active { display: block; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
        .card { background: #1e293b; padding: 10px; border-radius: 10px; text-align: center; }
        .card img { width: 100%; height: 120px; object-fit: cover; border-radius: 8px; }
        canvas { max-width: 300px; margin: 10px; }
    </style>
</head>
<body>

<div onclick="document.getElementById('finance').classList.toggle('active'); document.getElementById('wish').classList.toggle('active')">
    <button>Перемкнути (Бюджет / Вішліст)</button>
</div>

<div id="finance" class="tab active">
    <h3>1. Залишок (Дохід - Витрати)</h3>
    <canvas id="chart1"></canvas>
    <h3>2. Планові витрати</h3>
    <canvas id="chart2"></canvas>
    <h3>3. Скільки ще лишилось покрити</h3>
    <canvas id="chart3"></canvas>
</div>

<div id="wish" class="tab">
    <div class="grid" id="wish-grid"></div>
</div>

<script>
async function load() {
    const res = await fetch('data.json');
    const d = await res.json();

    // 1. Графік: Фактичний залишок
    const income = d.transactions.filter(t=>t.Тип=="Дохід").reduce((a,b)=>a+Number(b.Сума),0);
    const expense = d.transactions.filter(t=>t.Тип=="Витрата").reduce((a,b)=>a+Number(b.Сума),0);
    new Chart(document.getElementById('chart1'), {type:'pie', data:{labels:['Дохід','Витрати','Залишок'], datasets:[{data:[income, expense, income-expense]}]}});

    // 2. Графік: Планові витрати
    const plan = d.budget.filter(b=>b['Unnamed: 1'] && !isNaN(b['Unnamed: 1']));
    new Chart(document.getElementById('chart2'), {type:'bar', data:{labels:plan.map(b=>b['Планові доходи']), datasets:[{data:plan.map(b=>Number(b['Unnamed: 1']))}]}});

    // 3. Графік: Скільки лишилось покрити (план vs факт)
    const planTotal = plan.reduce((a,b)=>a+Number(b['Unnamed: 1']),0);
    new Chart(document.getElementById('chart3'), {type:'doughnut', data:{labels:['Витрачено','Лишилось'], datasets:[{data:[expense, Math.max(0, planTotal-expense)]}]}});

    // Вішліст з картинками
    const grid = document.getElementById('wish-grid');
    d.wishlist.forEach(i => {
        grid.innerHTML += `<div class="card"><img src="${i.image}"><h3>${i.title}</h3><p>${i.price} ₴</p></div>`;
    });
}
load();
</script>
</body>
</html>
