<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Бюджет та Вішліст</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; margin: 0; padding: 20px; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { padding: 10px 20px; border-radius: 8px; border: none; background: #1e293b; color: white; cursor: pointer; }
        .tab-btn.active { background: #2563eb; }
        .tab { display: none; }
        .tab.active { display: block; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
        .card { background: #1e293b; padding: 15px; border-radius: 10px; }
        canvas { max-width: 400px; margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="tabs">
    <button class="tab-btn active" onclick="showTab('finance')">📊 Бюджет</button>
    <button class="tab-btn" onclick="showTab('wish')">🎁 Вішліст</button>
</div>

<div id="finance" class="tab active">
    <h2>Графік витрат</h2>
    <canvas id="financeChart"></canvas>
</div>

<div id="wish" class="tab">
    <h2>Список бажань</h2>
    <div class="grid" id="wishlist-grid"></div>
</div>

<script>
    async function loadData() {
        try {
            const response = await fetch('data.json');
            const data = await response.json();
            
            // Відображення графіків (Finance)
            renderCharts(data.transactions);
            
            // Відображення списку (Wishlist)
            renderWishlist(data.wishlist);
        } catch (e) { console.error("Помилка завантаження data.json", e); }
    }

    function renderCharts(transactions) {
        const labels = [...new Set(transactions.map(t => t.Категорія))];
        const values = labels.map(cat => 
            transactions.filter(t => t.Категорія === cat && t.Тип === "Витрата")
                        .reduce((sum, t) => sum + Number(t.Сума || 0), 0)
        );

        new Chart(document.getElementById('financeChart'), {
            type: 'pie',
            data: { labels: labels, datasets: [{ data: values, backgroundColor: ['#f87171', '#fbbf24', '#34d399', '#60a5fa'] }] }
        });
    }

    function renderWishlist(wishlist) {
        const grid = document.getElementById("wishlist-grid");
        wishlist.forEach(i => {
            grid.innerHTML += `
                <div class="card">
                    <small>${i.category}</small>
                    <h3>${i.title}</h3>
                    <p><b>${i.price} ₴</b></p>
                    <a href="${i.url}" target="_blank" style="color:#60a5fa">Посилання</a>
                </div>
            `;
        });
    }

    function showTab(id) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    loadData();
</script>

</body>
</html>
