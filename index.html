<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мій Простір: Бюджет та Бажання</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  font-family: Arial, sans-serif;
  background: #0f172a;
  color: white;
  margin: 0;
  padding: 16px;
  -webkit-tap-highlight-color: transparent;
}

h1 {
  margin-bottom: 16px;
}

/* Блок логування помилок */
#debug-log {
  background: #1e1b4b;
  border: 1px solid #818cf8;
  border-radius: 10px;
  padding: 12px;
  margin-bottom: 16px;
  font-family: monospace;
  font-size: 12px;
  color: #c7d2fe;
  display: none;
}

/* Навігація вкладок */
.tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 20px;
  border-bottom: 1px solid #334155;
  padding-bottom: 8px;
}

.tab-btn {
  background: #1e293b;
  color: #94a3b8;
  padding: 10px 20px;
  border-radius: 10px;
  border: 1px solid #334155;
  cursor: pointer;
  font-weight: bold;
  font-size: 14px;
  transition: 0.2s;
}

.tab-btn.active {
  background: #2563eb;
  color: white;
  border-color: #2563eb;
}

.tab-content {
  display: none;
}

.tab-content.active {
  display: block;
}

/* Контейнери Бюджету */
.budget-header {
  background: #1e293b;
  border: 1px solid #334155;
  border-radius: 14px;
  padding: 20px;
  margin-bottom: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 16px;
}

.free-money-box {
  text-align: right;
}

.free-title {
  font-size: 11px;
  color: #34d399;
  text-transform: uppercase;
  letter-spacing: 1px;
  font-weight: bold;
}

.free-amount {
  font-size: 32px;
  font-weight: black;
  color: #34d399;
}

.budget-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}

.chart-card {
  background: #1e293b;
  border-radius: 14px;
  border: 1px solid #334155;
  padding: 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.chart-card h3 {
  margin: 0 0 4px 0;
  font-size: 16px;
  text-align: center;
}

.chart-card p {
  margin: 0 0 16px 0;
  font-size: 12px;
  color: #94a3b8;
  text-align: center;
}

.chart-wrapper {
  position: relative;
  width: 100%;
  height: 220px;
}

/* Список Бажань */
.controls {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 16px;
}

input, select {
  padding: 10px;
  border-radius: 10px;
  border: none;
  outline: none;
  background: #1e293b;
  color: white;
  border: 1px solid #334155;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 12px;
}

.card {
  background: #1e293b;
  border-radius: 14px;
  overflow: hidden;
  border: 1px solid #334155;
  transition: 0.2s;
}

.card:hover {
  transform: translateY(-3px);
  border-color: #3b82f6;
}

.card img {
  width: 100%;
  height: 170px;
  object-fit: contain;
  background: #0b1220;
  padding: 10px;
  box-sizing: border-box;
}

.content {
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.label {
  font-size: 10px;
  opacity: 0.6;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.category {
  font-size: 13px;
  opacity: 0.8;
}

.title {
  font-size: 16px;
  font-weight: bold;
}

.price {
  font-size: 16px;
  font-weight: bold;
  color: #34d399;
}

a {
  color: #60a5fa;
  text-decoration: none;
  font-size: 14px;
}

button {
  margin-top: 8px;
  padding: 10px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
  background: #2563eb;
  color: white;
  font-weight: bold;
}

button.bought {
  background: #16a34a;
}
</style>
</head>
<body>

<div id="debug-log"><strong>Статус синхронізації:</strong><br></div>

<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('budget-tab', this)">📊 Бюджет та Моніторинг</button>
  <button class="tab-btn" onclick="switchTab('wishlist-tab', this)">🎁 Список бажань</button>
</div>

<div id="budget-tab" class="tab-content active">
  <div class="budget-header">
    <div>
      <h1 style="margin:0;">Фінансовий моніторинг</h1>
      <p id="income-summary" style="margin:4px 0 0 0; color:#94a3b8; font-size:14px;">Обробка транзакцій...</p>
    </div>
    <div class="free-money-box">
      <div class="free-title">💰 Вільно зараз</div>
      <div id="free-money" class="free-amount">0 ₴</div>
    </div>
  </div>

  <div class="budget-grid">
    <div class="chart-card">
      <h3>1. Розподіл лімітів (План)</h3>
      <p>Куди планували розподілити кошти</p>
      <div class="chart-wrapper"><canvas id="planChart"></canvas></div>
    </div>
    
    <div class="chart-card">
      <h3>2. Куди вже пішло (Факт)</h3>
      <p>Реальні витрати з транзакцій</p>
      <div class="chart-wrapper"><canvas id="factChart"></canvas></div>
    </div>

    <div class="chart-card">
      <h3>3. Освоєння бюджету</h3>
      <p id="progress-desc">Витрачено із загального ліміту планових витрат</p>
      <div class="chart-wrapper"><canvas id="progressChart"></canvas></div>
    </div>
  </div>
</div>

<div id="wishlist-tab" class="tab-content">
  <h1>Список бажань</h1>
  <div class="controls">
    <input id="search" placeholder="Пошук...">
    <select id="category"><option value="all">Всі категорії</option></select>
    <select id="sort">
      <option value="none">Сортування</option>
      <option value="asc">Ціна ↑</option>
      <option value="desc">Ціна ↓</option>
    </select>
  </div>
  <div class="grid" id="grid"></div>
</div>

<script>
const SHEET_ID = "1W0Lm4Rf9UGrzNPf4JD9Io_XfroqOnrAf"; 

const URL_TRANSACTIONS = `https://opensheet.elk.sh/${SHEET_ID}/Транзакції`;
const URL_BUDGET       = `https://opensheet.elk.sh/${SHEET_ID}/Бюджет`;
const URL_WISHLIST     = `https://opensheet.elk.sh/${SHEET_ID}/Wishlist`; // Змінено на стандартну назву

let wishlistData = [];
let bought = JSON.parse(localStorage.getItem("bought") || "{}");

function showInfoMessage(msg) {
  const logBox = document.getElementById('debug-log');
  logBox.style.display = 'block';
  logBox.innerHTML += msg + '<br>';
}

function switchTab(tabId, btn) {
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(tabId).classList.add('active');
  btn.classList.add('active');
}

// Завантаження фінансових вкладок
Promise.all([
  fetch(URL_TRANSACTIONS).then(r => r.json()).catch(() => []),
  fetch(URL_BUDGET).then(r => r.json()).catch(() => [])
]).then(([transactions, budget]) => {
  renderBudgetDashboard(transactions, budget);
});

// Автономне завантаження списку бажань (щоб не блокувати головний екран)
fetch(URL_WISHLIST)
  .then(r => r.json())
  .then(data => {
    if (Array.isArray(data) && data.length > 0 && (data[0].title || data[0].Назва)) {
      wishlistData = data;
      setupWishlistFilters(wishlistData);
      renderWishlist(wishlistData);
    } else {
      showInfoMessage("ℹ️ Вкладку бажань 'Wishlist' не знайдено (або вона пуста). Моніторинг працює автономно.");
      renderWishlist([]);
    }
  })
  .catch(() => {
    renderWishlist([]);
  });

function renderBudgetDashboard(transactions, budget) {
  let factIncome = 0;
  let factExpense = 0;
  let expensesByCategory = {};

  if (!Array.isArray(transactions) || transactions.length === 0) {
    document.getElementById('income-summary').innerText = "Помилка: Не вдалося зчитати транзакції.";
    return;
  }

  // Чистий прорахунок транзакцій
  transactions.forEach(tx => {
    const type = tx["Тип"] || tx["тип"];
    const category = tx["Категорія"] || tx["категорія"];
    const sum = parseFloat(tx["Сума"] || tx["сума"]) || 0;

    if (type === "Дохід") {
      factIncome += sum;
    } else if (type === "Витрата") {
      factExpense += sum;
      if (category) {
        expensesByCategory[category] = (expensesByCategory[category] || 0) + sum;
      }
    }
  });

  let planIncomeTotal = 0;
  let planExpensesByCategory = {};
  let planExpensesTotal = 0;
  let isExpenseSection = false;

  if (Array.isArray(budget)) {
    budget.forEach(row => {
      const values = Object.values(row).map(v => String(v).trim());
      if (values.length === 0 || !values[0]) return;

      const firstCell = values[0];
      if (firstCell.includes("Планові доходы") || firstCell.includes("Планові доходи") || firstCell.includes("Скіко очікується")) return;
      if (firstCell.includes("Планові витрати")) {
        isExpenseSection = true;
        return;
      }
      if (firstCell === "Стаття" || firstCell === "Категорія") return;

      const name = firstCell;
      const planSum = parseFloat(values[1]) || 0;

      if (name && planSum > 0) {
        if (!isExpenseSection) {
          planIncomeTotal += planSum;
        } else {
          planExpensesByCategory[name] = planSum;
          planExpensesTotal += planSum;
        }
      }
    });
  }

  const freeMoney = factIncome - factExpense;

  document.getElementById('income-summary').innerText = `Очікуваний дохід (План): ${planIncomeTotal.toLocaleString('uk-UA')} ₴ | Отримано фактично: ${factIncome.toLocaleString('uk-UA')} ₴`;
  document.getElementById('free-money').innerText = freeMoney.toLocaleString('uk-UA') + ' ₴';
  
  const percentSpent = planExpensesTotal > 0 ? Math.round((factExpense / planExpensesTotal) * 100) : 0;
  document.getElementById('progress-desc').innerText = `Витрачено ${factExpense.toLocaleString('uk-UA')} ₴ з планового ліміту ${planExpensesTotal.toLocaleString('uk-UA')} ₴ (${percentSpent}%)`;

  const chartColors = ['#6366f1', '#3b82f6', '#10b981', '#eab308', '#f43f5e', '#a855f7', '#f97316', '#06b6d4', '#ec4899', '#14b8a6'];

  // Малюємо графіки
  new Chart(document.getElementById('planChart'), {
    type: 'doughnut',
    data: {
      labels: Object.keys(planExpensesByCategory),
      datasets: [{ data: Object.values(planExpensesByCategory), backgroundColor: chartColors, borderWidth: 0 }]
    },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
  });

  new Chart(document.getElementById('factChart'), {
    type: 'doughnut',
    data: {
      labels: Object.keys(expensesByCategory),
      datasets: [{ data: Object.values(expensesByCategory), backgroundColor: chartColors, borderWidth: 0 }]
    },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
  });

  const remainingPlan = Math.max(0, planExpensesTotal - factExpense);
  new Chart(document.getElementById('progressChart'), {
    type: 'doughnut',
    data: {
      labels: ['Вже витрачено', 'Вільний ліміт бюджету'],
      datasets: [{ data: [factExpense, remainingPlan], backgroundColor: ['#f43f5e', '#334155'], borderWidth: 0 }]
    },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { color: '#94a3b8', font: { size: 11 } } } } }
  });
}

// --- Фільтрація побажань ---
function setupWishlistFilters(data) {
  if (!data || data.length === 0) return;
  const categories = [...new Set(data.map(i => i.category || i.Категорія).filter(Boolean))];
  const cat = document.getElementById("category");
  categories.forEach(c => { cat.innerHTML += `<option value="${c}">${c}</option>`; });
  document.getElementById("search").addEventListener("input", applyWishlistFilters);
  document.getElementById("category").addEventListener("change", applyWishlistFilters);
  document.getElementById("sort").addEventListener("change", applyWishlistFilters);
}

function applyWishlistFilters() {
  let filtered = [...wishlistData];
  const search = document.getElementById("search").value.toLowerCase();
  const category = document.getElementById("category").value;
  const sort = document.getElementById("sort").value;
  
  if (search) filtered = filtered.filter(i => (i.title || i.Назва || "").toLowerCase().includes(search));
  if (category !== "all") filtered = filtered.filter(i => (i.category || i.Категорія) === category);
  if (sort === "asc")  filtered.sort((a, b) => Number(a.price || a.Ціна) - Number(b.price || b.Ціна));
  if (sort === "desc") filtered.sort((a, b) => Number(b.price || b.Ціна) - Number(a.price || a.Ціна));
  renderWishlist(filtered);
}

function toggleBought(title) {
  bought[title] = !bought[title];
  localStorage.setItem("bought", JSON.stringify(bought));
  applyWishlistFilters();
}

function renderWishlist(items) {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  if (!items || items.length === 0) {
    grid.innerHTML = "<p style='color:#94a3b8; font-size:14px; padding:10px;'>Вкладку бажань не активовано. Моніторинг бюджету працює у штатному режимі.</p>";
    return;
  }
  items.forEach(item => {
    const title = item.title || item.Назва || '-';
    const category = item.category || item.Категорія || '-';
    const price = item.price || item.Ціна || '';
    const url = item.url || item.Посилання || '#';
    const image = item.image || item.Картинка || '';
    const isBought = bought[title];
    
    grid.innerHTML += `
      <div class="card">
        <img src="${image}" onerror="this.style.display='none'">
        <div class="content">
          <div class="label">Категорія</div>
          <div class="category">${category}</div>
          <div class="label">Назва</div>
          <div class="title">${title}</div>
          <div class="label">Ціна</div>
          <div class="price">${price ? price + ' ₴' : '-'}</div>
          <div class="label">Посилання</div>
          <a href="${url}" target="_blank">відкрити товар</a>
          <button class="${isBought ? 'bought' : ''}" onclick="toggleBought('${title}')">
            ${isBought ? '✔ Куплено' : 'Позначити як куплено'}
          </button>
        </div>
      </div>
    `;
  });
}
</script>
</body>
</html>
