<!DOCTYPE html>  
<html lang="uk">  
<head>  
<meta charset="UTF-8">  
<meta name="viewport" content="width=device-width, initial-scale=1.0">  
<title>Бюджет Червень 2026</title>  
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Unbounded:wght@400;700&display=swap" rel="stylesheet">  
<style>  
  :root {  
    --bg: #0a0d12;  
    --surface: #111620;  
    --surface2: #1a2032;  
    --border: #232d42;  
    --accent: #4fffb0;  
    --accent2: #ff6b6b;  
    --accent3: #ffcc44;  
    --accent4: #4ab4ff;  
    --text: #e8edf5;  
    --muted: #6b7a99;  
    --font-display: 'Unbounded', sans-serif;  
    --font-mono: 'JetBrains Mono', monospace;  
  }  
  
  * { box-sizing: border-box; margin: 0; padding: 0; }  
  
  body {  
    background: var(--bg);  
    color: var(--text);  
    font-family: var(--font-mono);  
    min-height: 100vh;  
    padding: 0 0 80px;  
  }  
  
  /* HEADER */  
  .header {  
    background: var(--surface);  
    border-bottom: 1px solid var(--border);  
    padding: 18px 20px 14px;  
    position: sticky; top: 0; z-index: 100;  
  }  
  .header-top {  
    display: flex;  
    justify-content: space-between;  
    align-items: center;  
    margin-bottom: 14px;  
  }  
  .logo { font-family: var(--font-display); font-size: 15px; letter-spacing: -0.5px; color: var(--accent); }  
  .month-badge {  
    background: var(--border);  
    color: var(--muted);  
    font-size: 11px;  
    padding: 4px 10px;  
    border-radius: 20px;  
    letter-spacing: 1px;  
  }  
  
  /* NAV */  
  .nav {  
    display: flex;  
    gap: 6px;  
  }  
  .nav-btn {  
    flex: 1;  
    padding: 10px 0;  
    border: 1px solid var(--border);  
    background: transparent;  
    color: var(--muted);  
    font-family: var(--font-mono);  
    font-size: 12px;  
    border-radius: 8px;  
    cursor: pointer;  
    transition: all 0.2s;  
    letter-spacing: 0.5px;  
  }  
  .nav-btn.active {  
    background: var(--accent);  
    color: #0a0d12;  
    border-color: var(--accent);  
    font-weight: 700;  
  }  
  
  /* TABS */  
  .tab { display: none; padding: 16px 16px 0; }  
  .tab.active { display: block; }  
  
  /* OVERVIEW CARDS ROW */  
  .stats-row {  
    display: grid;  
    grid-template-columns: 1fr 1fr;  
    gap: 10px;  
    margin-bottom: 14px;  
  }  
  .stats-row.three { grid-template-columns: 1fr 1fr 1fr; }  
  
  .stat-card {  
    background: var(--surface);  
    border: 1px solid var(--border);  
    border-radius: 12px;  
    padding: 14px 12px;  
    position: relative;  
    overflow: hidden;  
  }  
  .stat-card::before {  
    content: '';  
    position: absolute;  
    top: 0; left: 0; right: 0;  
    height: 2px;  
    background: var(--card-accent, var(--accent));  
  }  
  .stat-label {  
    font-size: 10px;  
    color: var(--muted);  
    letter-spacing: 1px;  
    text-transform: uppercase;  
    margin-bottom: 8px;  
  }  
  .stat-value {  
    font-family: var(--font-display);  
    font-size: 20px;  
    font-weight: 700;  
    color: var(--card-accent, var(--accent));  
    line-height: 1;  
    margin-bottom: 4px;  
  }  
  .stat-sub {  
    font-size: 10px;  
    color: var(--muted);  
  }  
  
  /* SECTION TITLE */  
  .section-title {  
    font-size: 11px;  
    color: var(--muted);  
    letter-spacing: 2px;  
    text-transform: uppercase;  
    margin: 20px 0 10px;  
  }  
  
  /* PROGRESS BAR */  
  .progress-block {  
    background: var(--surface);  
    border: 1px solid var(--border);  
    border-radius: 12px;  
    padding: 14px;  
    margin-bottom: 8px;  
  }  
  .progress-header {  
    display: flex;  
    justify-content: space-between;  
    align-items: center;  
    margin-bottom: 10px;  
  }  
  .progress-name {  
    font-size: 13px;  
    color: var(--text);  
    display: flex;  
    align-items: center;  
    gap: 8px;  
  }  
  .progress-emoji { font-size: 16px; }  
  .progress-amounts {  
    font-size: 11px;  
    color: var(--muted);  
    text-align: right;  
  }  
  .progress-fact { font-size: 13px; color: var(--text); font-weight: 600; }  
  .progress-bar-wrap {  
    height: 6px;  
    background: var(--border);  
    border-radius: 3px;  
    overflow: hidden;  
  }  
  .progress-bar-fill {  
    height: 100%;  
    border-radius: 3px;  
    transition: width 0.6s ease;  
  }  
  .bar-ok { background: var(--accent); }  
  .bar-warn { background: var(--accent3); }  
  .bar-over { background: var(--accent2); }  
  
  /* TRANSACTIONS */  
  .tx-item {  
    display: flex;  
    align-items: center;  
    gap: 12px;  
    padding: 12px 14px;  
    background: var(--surface);  
    border: 1px solid var(--border);  
    border-radius: 10px;  
    margin-bottom: 8px;  
  }  
  .tx-icon {  
    width: 36px; height: 36px;  
    border-radius: 10px;  
    background: var(--surface2);  
    display: flex; align-items: center; justify-content: center;  
    font-size: 17px;  
    flex-shrink: 0;  
  }  
  .tx-info { flex: 1; min-width: 0; }  
  .tx-desc { font-size: 13px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }  
  .tx-cat { font-size: 10px; color: var(--muted); margin-top: 2px; }  
  .tx-amount { font-size: 14px; font-weight: 700; white-space: nowrap; }  
  .tx-amount.income { color: var(--accent); }  
  .tx-amount.expense { color: var(--accent2); }  
  .tx-date { font-size: 10px; color: var(--muted); }  
  
  /* WISHLIST */  
  .wish-grid {  
    display: grid;  
    grid-template-columns: 1fr 1fr;  
    gap: 10px;  
  }  
  .wish-card {  
    background: var(--surface);  
    border: 1px solid var(--border);  
    border-radius: 12px;  
    overflow: hidden;  
    cursor: pointer;  
    transition: transform 0.2s, border-color 0.2s;  
    text-decoration: none;  
  }  
  .wish-card:active { transform: scale(0.97); }  
  .wish-card:hover { border-color: var(--accent4); }  
  .wish-img {  
    width: 100%;  
    height: 140px;  
    object-fit: contain;  
    display: block;  
    background: var(--surface2);  
    padding: 8px;  
  }  
  .wish-body { padding: 10px; }  
  .wish-cat {  
    font-size: 9px;  
    color: var(--muted);  
    letter-spacing: 1px;  
    text-transform: uppercase;  
    margin-bottom: 4px;  
  }  
  .wish-title {  
    font-size: 12px;  
    color: var(--text);  
    margin-bottom: 6px;  
    line-height: 1.4;  
  }  
  .wish-price {  
    font-family: var(--font-display);  
    font-size: 14px;  
    color: var(--accent3);  
    font-weight: 700;  
  }  
  
  /* DONUT CHART */  
  .donut-wrap {  
    display: flex;  
    align-items: center;  
    gap: 16px;  
    background: var(--surface);  
    border: 1px solid var(--border);  
    border-radius: 12px;  
    padding: 16px;  
    margin-bottom: 14px;  
  }  
  .donut-svg { flex-shrink: 0; }  
  .donut-legend { flex: 1; }  
  .legend-item {  
    display: flex;  
    align-items: center;  
    gap: 8px;  
    margin-bottom: 8px;  
    font-size: 12px;  
  }  
  .legend-dot {  
    width: 8px; height: 8px;  
    border-radius: 50%;  
    flex-shrink: 0;  
  }  
  .legend-label { color: var(--muted); flex: 1; }  
  .legend-val { color: var(--text); font-weight: 600; }  
  
  /* ALERT */  
  .alert {  
    background: rgba(255,107,107,0.1);  
    border: 1px solid rgba(255,107,107,0.3);  
    border-radius: 10px;  
    padding: 12px 14px;  
    font-size: 12px;  
    color: var(--accent2);  
    margin-bottom: 10px;  
    display: flex;  
    align-items: center;  
    gap: 8px;  
  }  
  
  /* SUMMARY BALANCE */  
  .balance-big {  
    background: var(--surface);  
    border: 1px solid var(--border);  
    border-radius: 14px;  
    padding: 20px;  
    margin-bottom: 14px;  
    text-align: center;  
    position: relative;  
    overflow: hidden;  
  }  
  .balance-big::before {  
    content: '';  
    position: absolute;  
    top: 0; left: 0; right: 0;  
    height: 3px;  
    background: linear-gradient(90deg, var(--accent), var(--accent4));  
  }  
  .balance-label { font-size: 11px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px; }  
  .balance-num {  
    font-family: var(--font-display);  
    font-size: 36px;  
    font-weight: 700;  
    line-height: 1;  
    margin-bottom: 6px;  
  }  
  .balance-sub { font-size: 11px; color: var(--muted); }  
  
  /* LOADING */  
  #loading {  
    display: flex;  
    align-items: center;  
    justify-content: center;  
    min-height: 60vh;  
    font-size: 13px;  
    color: var(--muted);  
    flex-direction: column;  
    gap: 12px;  
  }  
  .spinner {  
    width: 32px; height: 32px;  
    border: 2px solid var(--border);  
    border-top-color: var(--accent);  
    border-radius: 50%;  
    animation: spin 0.8s linear infinite;  
  }  
  @keyframes spin { to { transform: rotate(360deg); } }  

  /* ── DESKTOP ── */
  @media (min-width: 768px) {
    body { padding: 0 0 60px; }

    .header {
      padding: 18px calc(50vw - 360px) 14px;
    }
    .header-top { max-width: 720px; margin: 0 auto 14px; }
    .nav { max-width: 720px; margin: 0 auto; }

    .tab { padding: 24px calc(50vw - 360px) 0; }

    .stats-row { max-width: 720px; margin-left: auto; margin-right: auto; }

    .stat-value { font-size: 22px; }

    /* 2-col layout for overview bottom section */
    .overview-bottom {
      max-width: 720px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      align-items: start;
    }

    #ov-alerts { max-width: 720px; margin: 0 auto; }
    .donut-wrap { max-width: 720px; margin-left: auto; margin-right: auto; }

    #cat-list, #tx-list { max-width: 720px; margin: 0 auto; }
    .section-title { max-width: 720px; margin-left: auto; margin-right: auto; }

    /* Wishlist: 3 cols on tablet, 4 on wide */
    .wish-grid { grid-template-columns: repeat(3, 1fr); max-width: 720px; margin: 0 auto; }
    .wish-stat { max-width: 720px; margin: 0 auto 14px; }

    #wish-content > .section-title { max-width: 720px; margin-left: auto; margin-right: auto; }
    #wish-content > div[style] { max-width: 720px; margin-left: auto; margin-right: auto; }
  }

  @media (min-width: 1100px) {
    .header { padding: 18px calc(50vw - 480px) 14px; }
    .header-top { max-width: 960px; }
    .nav { max-width: 960px; }
    .tab { padding: 24px calc(50vw - 480px) 0; }
    .stats-row, #ov-alerts, .donut-wrap, #cat-list, #tx-list, .section-title { max-width: 960px; }
    .overview-bottom { max-width: 960px; }
    .wish-grid { grid-template-columns: repeat(4, 1fr); max-width: 960px; }
    #wish-content > .section-title,
    #wish-content > div[style] { max-width: 960px; }
  }

</style>  
</head>  
<body>  
  
<div class="header">  
  <div class="header-top">  
    <div class="logo">&#8372; бюджет</div>  
    <div class="month-badge">ЧЕРВЕНЬ 2026</div>  
  </div>  
  <div class="nav">  
    <button class="nav-btn active" onclick="showTab('overview', this)">&#128202; Огляд</button>  
    <button class="nav-btn" onclick="showTab('categories', this)">&#128194; Статті</button>  
    <button class="nav-btn" onclick="showTab('txs', this)">&#128203; Транзакції</button>  
    <button class="nav-btn" onclick="showTab('wish', this)">&#127873; Вішліст</button>  
  </div>  
</div>  
  
<div id="loading">  
  <div class="spinner"></div>  
  <div>Завантаження...</div>  
</div>  
  
<div id="app" style="display:none">  
  
<!-- TAB: OVERVIEW -->  
<div id="tab-overview" class="tab active">  
  <div class="stats-row" style="margin-top:16px">  
    <div class="stat-card" style="--card-accent: var(--accent)">  
      <div class="stat-label">Реальний залишок</div>  
      <div class="stat-value" id="ov-balance">—</div>  
      <div class="stat-sub" id="ov-balance-sub"></div>  
    </div>  
    <div class="stat-card" style="--card-accent: var(--accent3)">  
      <div class="stat-label">Очікується ще</div>  
      <div class="stat-value" id="ov-expected">—</div>  
      <div class="stat-sub">аванс / решта зп</div>  
    </div>  
  </div>  
  
  <div class="stats-row three">  
    <div class="stat-card" style="--card-accent: var(--accent4)">  
      <div class="stat-label">Доходи</div>  
      <div class="stat-value" id="ov-income">—</div>  
      <div class="stat-sub">факт</div>  
    </div>  
    <div class="stat-card" style="--card-accent: var(--accent2)">  
      <div class="stat-label">Витрати</div>  
      <div class="stat-value" id="ov-expense">—</div>  
      <div class="stat-sub">факт</div>  
    </div>  
    <div class="stat-card" style="--card-accent: #a78bfa">  
      <div class="stat-label">За планом</div>  
      <div class="stat-value" id="ov-plan">—</div>  
      <div class="stat-sub">заплановано</div>  
    </div>  
  </div>  
  
  <div id="ov-alerts"></div>
  <div class="overview-bottom">
    <div class="donut-wrap" id="ov-donut-wrap"></div>
    <div>
      <div class="section-title" style="margin-top:0">Розподіл витрат</div>
      <div id="ov-expense-cats"></div>
    </div>
  </div>  
</div>  
  
<!-- TAB: CATEGORIES -->  
<div id="tab-categories" class="tab">  
  <div class="section-title" style="margin-top:16px">Факт vs план</div>  
  <div id="cat-list"></div>  
</div>  
  
<!-- TAB: TRANSACTIONS -->  
<div id="tab-txs" class="tab">  
  <div class="section-title" style="margin-top:16px">Всі транзакції</div>  
  <div id="tx-list"></div>  
</div>  
  
<!-- TAB: WISHLIST -->  
<div id="tab-wish" class="tab">  
  <div style="margin-top:16px" id="wish-content"></div>  
</div>  
  
</div><!-- #app -->  
  
<script>  
const CAT_EMOJI = {  
  'Оренда':'🏠','Комуналка':'💡','Їжа':'🛒','Транспорт':'🚌','Звʼязок':'📱',  
  "Зв'язок":'📱','Побут':'🧹','Хотілки':'✨','Медицина':'💊','Відкладення':'💰',  
  'Зарплата':'💵','Кредит':'🏦','Англ':'📚','Готівка':'💵','Перевод':'↔️',
  'Розваги':'🎭','Театр':'🎭',
  'default':'💸'  
};  
  
function emoji(cat) {  
  if (!cat) return '💸';  
  for (const [k,v] of Object.entries(CAT_EMOJI)) {  
    if (cat.toLowerCase().includes(k.toLowerCase())) return v;  
  }  
  return CAT_EMOJI.default;  
}  
  
function fmt(n) {  
  return Number(n).toLocaleString('uk-UA') + ' ₴';  
}  
  
function fmtDate(iso) {  
  const d = new Date(iso);  
  return `${d.getDate().toString().padStart(2,'0')}.${(d.getMonth()+1).toString().padStart(2,'0')}`;  
}  
  
function barClass(pct) {  
  if (pct >= 100) return 'bar-over';  
  if (pct >= 80) return 'bar-warn';  
  return 'bar-ok';  
}  
  
function buildDonut(segments, size=120) {  
  const cx = size/2, cy = size/2, r = 46, stroke = 16;  
  const total = segments.reduce((a,s)=>a+s.value,0);  
  if (!total) return `<svg width="${size}" height="${size}" class="donut-svg"></svg>`;  
  let angle = -Math.PI/2;  
  let paths = '';  
  for (const seg of segments) {  
    const sweep = (seg.value/total)*2*Math.PI;  
    const x1 = cx + r*Math.cos(angle);  
    const y1 = cy + r*Math.sin(angle);  
    const x2 = cx + r*Math.cos(angle+sweep);  
    const y2 = cy + r*Math.sin(angle+sweep);  
    const large = sweep > Math.PI ? 1 : 0;  
    paths += `<path d="M ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2}" fill="none" stroke="${seg.color}" stroke-width="${stroke}" stroke-linecap="round"/>`;  
    angle += sweep + 0.03;  
  }  
  const balText = segments.find(s=>s.label==='Залишок');  
  const pct = balText ? Math.round(balText.value/total*100) : '';  
  return `<svg width="${size}" height="${size}" class="donut-svg" viewBox="0 0 ${size} ${size}">  
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#232d42" stroke-width="${stroke}"/>  
    ${paths}  
    <text x="${cx}" y="${cy-6}" text-anchor="middle" fill="#e8edf5" font-size="16" font-family="'Unbounded',sans-serif" font-weight="700">${pct}%</text>  
    <text x="${cx}" y="${cy+12}" text-anchor="middle" fill="#6b7a99" font-size="9" font-family="'JetBrains Mono',monospace">залишок</text>  
  </svg>`;  
}  
  
async function load() {  
  let d;  
  try {  
    const res = await fetch('data.json');  
    d = await res.json();  
  } catch(e) {  
    document.getElementById('loading').innerHTML = '<div style="color:#ff6b6b">Помилка завантаження data.json</div>';  
    return;  
  }  
  
  document.getElementById('loading').style.display = 'none';  
  document.getElementById('app').style.display = 'block';  
  
  const txs = (d.transactions || []).map(t => ({  
    date: t['Дата'] || t.date || '',  
    type: t['Тип'] || t.type || '',  
    cat: t['Категорія'] || t.cat || '',  
    desc: t['Опис'] || t.desc || '',  
    sum: Number(t['Сума'] || t.sum || 0)  
  }));  
  
  const budget = (d.budget || []);  
  
  const planMap = {};  
  let expectedIncome = 0;  
  for (const row of budget) {  
    const name = row['Планові доходи'] || '';  
    const plan = row['Unnamed: 1'] || row['План'] || '';  
    const fact = row['Unnamed: 2'] || row['Факт'] || '';  
    if (!isNaN(Number(plan)) && plan !== '' && plan !== '0') {  
      planMap[name] = { plan: Number(plan), fact: Number(fact) || 0 };  
    }  
    if (name === 'Скіко очікується' && fact) {  
      expectedIncome = Number(fact) || 0;  
    }  
  }  
  
  const income = txs.filter(t=>t.type==='Дохід').reduce((a,t)=>a+t.sum,0);  
  const expense = txs.filter(t=>t.type==='Витрата').reduce((a,t)=>a+t.sum,0);  
  const balance = income - expense;  
  
  const planExpense = Object.entries(planMap)  
    .filter(([k])=>k!=='Зарплата (перша виплата)'&&k!=='Аванс'&&k!=='Скіко очікується')  
    .reduce((a,[,v])=>a+v.plan,0);  
  
  const catActual = {};  
  for (const t of txs.filter(t=>t.type==='Витрата')) {  
    catActual[t.cat] = (catActual[t.cat]||0) + t.sum;  
  }  
  
  // OVERVIEW  
  document.getElementById('ov-balance').textContent = fmt(balance);  
  document.getElementById('ov-balance-sub').textContent = balance >= 0 ? 'у плюсі' : '⚠ у мінусі';  
  document.getElementById('ov-expected').textContent = fmt(expectedIncome);  
  document.getElementById('ov-income').textContent = fmt(income);  
  document.getElementById('ov-expense').textContent = fmt(expense);  
  document.getElementById('ov-plan').textContent = fmt(planExpense);  
  
  const alerts = [];  
  for (const [cat, vals] of Object.entries(planMap)) {  
    const actual = catActual[cat] || 0;  
    if (actual > vals.plan && vals.plan > 0) {  
      alerts.push(`${emoji(cat)} <b>${cat}</b>: перевищення на ${fmt(actual - vals.plan)} (план ${fmt(vals.plan)}, факт ${fmt(actual)})`);  
    }  
  }  
  const alertsEl = document.getElementById('ov-alerts');  
  if (alerts.length) {  
    alertsEl.innerHTML = alerts.map(a=>`<div class="alert">⚠️ ${a}</div>`).join('');  
  }  
  
  const donutSegs = [  
    { label: 'Витрачено', value: expense, color: '#ff6b6b' },  
    { label: 'Залишок', value: Math.max(0, balance), color: '#4fffb0' },  
  ];  
  const legendItems = [  
    { label: 'Доходи (факт)', value: income, color: '#4ab4ff' },  
    { label: 'Витрачено', value: expense, color: '#ff6b6b' },  
    { label: 'Залишок', value: Math.max(0,balance), color: '#4fffb0' },  
    { label: 'Очікується', value: expectedIncome, color: '#ffcc44' },  
  ];  
  document.getElementById('ov-donut-wrap').innerHTML = `  
    ${buildDonut(donutSegs)}  
    <div class="donut-legend">  
      ${legendItems.map(i=>`  
        <div class="legend-item">  
          <div class="legend-dot" style="background:${i.color}"></div>  
          <div class="legend-label">${i.label}</div>  
          <div class="legend-val">${fmt(i.value)}</div>  
        </div>`).join('')}  
    </div>`;  
  
  const topCats = Object.entries(catActual).sort((a,b)=>b[1]-a[1]).slice(0,5);  
  const topTotal = topCats.reduce((a,[,v])=>a+v,0);  
  document.getElementById('ov-expense-cats').innerHTML = topCats.map(([cat,val])=>{  
    const pct = topTotal ? Math.round(val/topTotal*100) : 0;  
    return `<div class="progress-block">  
      <div class="progress-header">  
        <div class="progress-name"><span class="progress-emoji">${emoji(cat)}</span>${cat}</div>  
        <div class="progress-amounts">  
          <div class="progress-fact">${fmt(val)}</div>  
          <div>${pct}% від витрат</div>  
        </div>  
      </div>  
      <div class="progress-bar-wrap">  
        <div class="progress-bar-fill bar-ok" style="width:${pct}%"></div>  
      </div>  
    </div>`;  
  }).join('');  
  
  // CATEGORIES  
  const planExpenseItems = [  
    {name:'Оренда',plan:planMap['Оренда']?.plan||0},  
    {name:'Комуналка',plan:planMap['Комуналка']?.plan||0},  
    {name:'Їжа',plan:planMap['Їжа']?.plan||0},  
    {name:'Транспорт',plan:planMap['Транспорт']?.plan||0},  
    {name:'Звʼязок',plan:planMap['Звʼязок']?.plan||planMap["Зв'язок"]?.plan||0},  
    {name:'Побут',plan:planMap['Побут']?.plan||0},  
    {name:'Хотілки',plan:planMap['Хотілки']?.plan||0},  
    {name:'Медицина',plan:planMap['Медицина']?.plan||0},  
    {name:'Відкладення',plan:planMap['Відкладення']?.plan||0},  
    {name:'Англа',plan:planMap['Англа']?.plan||0},  
    {name:'Кредит',plan:planMap['Кредит']?.plan||0},  
  ];  
  
  const catListEl = document.getElementById('cat-list');  
  catListEl.innerHTML = planExpenseItems.map(item=>{  
    let actual = 0;  
    for (const [k,v] of Object.entries(catActual)) {  
      if (k.toLowerCase().includes(item.name.toLowerCase().slice(0,4)) ||  
          item.name.toLowerCase().includes(k.toLowerCase().slice(0,4))) {  
        actual += v;  
      }  
    }  
    const plan = item.plan;  
    const pct = plan > 0 ? Math.min(Math.round(actual/plan*100),150) : (actual>0?100:0);  
    const cls = barClass(pct);  
    const overText = actual > plan && plan > 0 ? `<span style="color:var(--accent2);font-size:10px"> +${fmt(actual-plan)}</span>` : '';  
    return `<div class="progress-block">  
      <div class="progress-header">  
        <div class="progress-name"><span class="progress-emoji">${emoji(item.name)}</span>${item.name}</div>  
        <div class="progress-amounts">  
          <div class="progress-fact">${fmt(actual)}${overText}</div>  
          <div>план: ${fmt(plan)}</div>  
        </div>  
      </div>  
      <div class="progress-bar-wrap">  
        <div class="progress-bar-fill ${cls}" style="width:${Math.min(pct,100)}%"></div>  
      </div>  
    </div>`;  
  }).join('');  
  
  // TRANSACTIONS  
  const txListEl = document.getElementById('tx-list');  
  const sorted = [...txs].sort((a,b)=>new Date(b.date)-new Date(a.date));  
  txListEl.innerHTML = sorted.map(t=>{  
    const isIncome = t.type==='Дохід';  
    return `<div class="tx-item">  
      <div class="tx-icon">${emoji(t.cat)}</div>  
      <div class="tx-info">  
        <div class="tx-desc">${t.desc || t.cat}</div>  
        <div class="tx-cat">${t.cat} · ${fmtDate(t.date)}</div>  
      </div>  
      <div>  
        <div class="tx-amount ${isIncome?'income':'expense'}">${isIncome?'+':'-'}${fmt(t.sum)}</div>  
      </div>  
    </div>`;  
  }).join('');  
  
  // WISHLIST  
  const wishlist = d.wishlist || [];  
  const cats = [...new Set(wishlist.map(w=>w.category))];  
  const wishEl = document.getElementById('wish-content');  
  
  const totalWish = wishlist.reduce((a,w)=>a+Number(w.price||0),0);  
  wishEl.innerHTML = `  
    <div class="stat-card" style="--card-accent:var(--accent3);margin-bottom:14px">  
      <div class="stat-label">Всього у вішлісті</div>  
      <div class="stat-value">${fmt(totalWish)}</div>  
      <div class="stat-sub">${wishlist.length} товарів</div>  
    </div>`;  
  
  for (const cat of cats) {  
    const items = wishlist.filter(w=>w.category===cat);  
    wishEl.innerHTML += `<div class="section-title">${cat}</div>  
      <div class="wish-grid" style="margin-bottom:16px">  
        ${items.map(w=>`  
          <a href="${w.url}" target="_blank" class="wish-card">  
            <img class="wish-img" src="${w.image}" loading="lazy" onerror="this.style.display='none'">  
            <div class="wish-body">  
              <div class="wish-cat">${w.category}</div>  
              <div class="wish-title">${w.title}</div>  
              <div class="wish-price">${fmt(w.price)}</div>  
            </div>  
          </a>`).join('')}  
      </div>`;  
  }  
}  
  
function showTab(id, btn) {  
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));  
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));  
  document.getElementById('tab-'+id).classList.add('active');  
  btn.classList.add('active');  
}  
  
load();  
</script>  
</body>  
</html>
