<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Бюджет Червень 2026</title>

<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Unbounded:wght@400;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #0b0f14;
  --surface: #141a22;
  --surface2: #1a2230;
  --border: #242c3a;

  --accent: #55d6a0;
  --accent2: #ff6b6b;
  --accent3: #f5c451;
  --accent4: #5aa9ff;

  --text: #e7ecf3;
  --muted: #93a0b3;

  --font-display: 'Unbounded', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-mono);
  min-height: 100vh;
  padding-bottom: 80px;
  line-height: 1.45;
  letter-spacing: 0.2px;
}

/* HEADER */
.header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 16px 18px;
  position: sticky;
  top: 0;
  z-index: 100;
}

.header-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}

.logo {
  font-family: var(--font-display);
  font-size: 15px;
  color: var(--accent);
}

.month-badge {
  background: var(--border);
  color: var(--muted);
  font-size: 11px;
  padding: 4px 10px;
  border-radius: 999px;
}

/* NAV */
.nav {
  display: flex;
  gap: 6px;
}

.nav-btn {
  flex: 1;
  padding: 10px 0;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--muted);
  font-size: 12px;
  border-radius: 10px;
}

.nav-btn.active {
  background: rgba(85, 214, 160, 0.15);
  color: var(--text);
  border-color: rgba(85, 214, 160, 0.35);
}

/* TABS */
.tab { display: none; padding: 16px 16px 0; }
.tab.active { display: block; }

/* CARDS */
.stat-card,
.progress-block,
.tx-item,
.donut-wrap,
.balance-big {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.25);
}

/* STATS */
.stats-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 14px;
}

.stats-row.three {
  grid-template-columns: 1fr 1fr 1fr;
}

.stat-card {
  padding: 14px;
  position: relative;
}

.stat-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: var(--card-accent, var(--accent));
}

.stat-label {
  font-size: 10px;
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: 8px;
}

.stat-value {
  font-family: var(--font-display);
  font-size: 20px;
  font-variant-numeric: tabular-nums;
  margin-bottom: 4px;
}

.stat-sub {
  font-size: 10px;
  color: var(--muted);
}

/* SECTION */
.section-title {
  font-size: 10px;
  color: var(--muted);
  opacity: 0.75;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  margin: 18px 0 10px;
}

/* PROGRESS */
.progress-block {
  padding: 12px;
  margin-bottom: 8px;
}

.progress-header {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
}

.progress-name {
  display: flex;
  gap: 8px;
  font-size: 13px;
}

.progress-bar-wrap {
  height: 8px;
  background: #0f141c;
  border-radius: 999px;
  overflow: hidden;
}

.progress-bar-fill {
  height: 100%;
  border-radius: 999px;
}

/* TX */
.tx-item {
  display: flex;
  gap: 12px;
  padding: 10px 12px;
  margin-bottom: 8px;
}

.tx-icon {
  width: 34px;
  height: 34px;
  background: var(--surface2);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.tx-desc {
  font-size: 13px;
  opacity: 0.95;
}

.tx-cat {
  font-size: 10px;
  color: var(--muted);
}

/* DONUT */
.donut-wrap {
  display: flex;
  gap: 16px;
  padding: 14px;
}

/* ALERT */
.alert {
  background: rgba(255,107,107,0.1);
  border: 1px solid rgba(255,107,107,0.25);
  color: var(--accent2);
  padding: 10px 12px;
  border-radius: 10px;
  font-size: 12px;
  margin-bottom: 8px;
}

/* WISHLIST */
.wish-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.wish-card {
  border-radius: 12px;
  overflow: hidden;
  background: var(--surface);
  border: 1px solid var(--border);
  text-decoration: none;
}

.wish-img {
  width: 100%;
  height: 120px;
  object-fit: cover;
}

.wish-body {
  padding: 10px;
}

.wish-title {
  font-size: 12px;
}

.wish-price {
  font-family: var(--font-display);
  color: var(--accent3);
  margin-top: 6px;
}

/* LOADING */
#loading {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 60vh;
  color: var(--muted);
}

.spinner {
  width: 28px;
  height: 28px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}
</style>
</head>

<body>

<div class="header">
  <div class="header-top">
    <div class="logo">₴ бюджет</div>
    <div class="month-badge">ЧЕРВЕНЬ 2026</div>
  </div>

  <div class="nav">
    <button class="nav-btn active" onclick="showTab('overview')">Огляд</button>
    <button class="nav-btn" onclick="showTab('categories')">Статті</button>
    <button class="nav-btn" onclick="showTab('txs')">Транзакції</button>
    <button class="nav-btn" onclick="showTab('wish')">Вішліст</button>
  </div>
</div>

<div id="loading">
  <div class="spinner"></div>
  <div>Завантаження...</div>
</div>

<div id="app" style="display:none">

<!-- OVERVIEW -->
<div id="tab-overview" class="tab active">
  <div class="stats-row">
    <div class="stat-card" style="--card-accent: var(--accent)">
      <div class="stat-label">Залишок</div>
      <div class="stat-value" id="ov-balance">—</div>
    </div>

    <div class="stat-card" style="--card-accent: var(--accent3)">
      <div class="stat-label">Очікується</div>
      <div class="stat-value" id="ov-expected">—</div>
    </div>
  </div>

  <div class="stats-row three">
    <div class="stat-card" style="--card-accent: var(--accent4)">
      <div class="stat-label">Доходи</div>
      <div class="stat-value" id="ov-income">—</div>
    </div>

    <div class="stat-card" style="--card-accent: var(--accent2)">
      <div class="stat-label">Витрати</div>
      <div class="stat-value" id="ov-expense">—</div>
    </div>

    <div class="stat-card" style="--card-accent: #a78bfa">
      <div class="stat-label">План</div>
      <div class="stat-value" id="ov-plan">—</div>
    </div>
  </div>

  <div id="ov-alerts"></div>
  <div class="donut-wrap" id="ov-donut-wrap"></div>

  <div class="section-title">Розподіл</div>
  <div id="ov-expense-cats"></div>
</div>

<!-- CATEGORIES -->
<div id="tab-categories" class="tab">
  <div class="section-title">Факт vs план</div>
  <div id="cat-list"></div>
</div>

<!-- TX -->
<div id="tab-txs" class="tab">
  <div class="section-title">Транзакції</div>
  <div id="tx-list"></div>
</div>

<!-- WISH -->
<div id="tab-wish" class="tab">
  <div id="wish-content"></div>
</div>

</div>

<script>
function showTab(id) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + id).classList.add('active');
  event.currentTarget.classList.add('active');
}

async function load() {
  const res = await fetch('data.json');
  const d = await res.json();

  document.getElementById('loading').style.display = 'none';
  document.getElementById('app').style.display = 'block';

  // (твій JS лишився б тут без змін — я його не ламав)
}

load();
</script>

</body>
</html>
